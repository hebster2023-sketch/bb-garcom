<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.B Churrasco — Sistema em Nuvem</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Versão Compatível com Navegador) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-red-900 via-stone-900 to-black p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-red-900/20">
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-red-100 rounded-full text-red-600 text-3xl mb-3 shadow-inner">🔥</div>
                <h1 class="text-2xl font-bold text-gray-900">B.B CHURRASCO</h1>
                <p class="text-sm text-gray-500 mt-1">Faça login para acessar o sistema</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">E-mail de Acesso</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-600 focus:outline-none transition text-sm" placeholder="ex: garcom@bbchurrasco.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Senha</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-600 focus:outline-none transition text-sm" placeholder="••••••••">
                </div>
                <div id="login-error" class="text-red-600 text-xs text-center font-medium hidden">E-mail ou senha incorretos.</div>
                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO SISTEMA -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col justify-between">
        <div>
            <!-- Cabeçalho -->
            <header class="bg-gradient-to-r from-red-800 to-red-950 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
                <div>
                    <h1 class="text-lg font-bold tracking-wide">B.B CHURRASCO</h1>
                    <p id="user-role-label" class="text-xs text-red-200">Sistema em Nuvem</p>
                </div>
                <button onclick="handleLogout()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Sair</button>
            </header>

            <!-- Conteúdo Dinâmico -->
            <main class="p-4 max-w-4xl mx-auto pb-24">
                <!-- Seção Mesas -->
                <section id="tab-mesas" class="space-y-4">
                    <h2 class="text-lg font-bold text-gray-800">Controle de Mesas</h2>
                    <div id="grid-mesas" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <!-- Gerado dinamicamente -->
                    </div>
                </section>

                <!-- Seção Comandas / Cardápio com Fotos Reais -->
                <section id="tab-comandas" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-gray-800">Lançamento de Pedidos</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="menu-list">
                        <!-- Produtos com imagens reais -->
                    </div>
                </section>

                <!-- Seção Relatórios (Restrita para Admin) -->
                <section id="tab-relatorios" class="hidden space-y-4">
                    <h2 class="text-lg font-bold text-gray-800">Relatório Financeiro</h2>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm text-gray-500">Resumo do Faturamento Diário</p>
                        <h3 class="text-2xl font-bold text-emerald-700 mt-1">R$ 0,00</h3>
                    </div>
                </section>
            </main>
        </div>

        <!-- Barra de Navegação Inferior -->
        <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 shadow-lg flex justify-around p-2 z-50">
            <button onclick="switchTab('mesas')" id="nav-mesas" class="flex flex-col items-center text-red-700 p-2">
                <span class="text-xl">🪑</span>
                <span class="text-xs font-semibold mt-1">Mesas</span>
            </button>
            <button onclick="switchTab('comandas')" id="nav-comandas" class="flex flex-col items-center text-gray-400 p-2">
                <span class="text-xl">📋</span>
                <span class="text-xs font-semibold mt-1">Comandas</span>
            </button>
            <button onclick="switchTab('relatorios')" id="nav-relatorios" class="flex flex-col items-center text-gray-400 p-2">
                <span class="text-xl">📊</span>
                <span class="text-xs font-semibold mt-1">Relatórios</span>
            </button>
        </nav>
    </div>

    <script>
        // Configuração do Firebase com as suas credenciais reais
        const firebaseConfig = {
            apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
            authDomain: "bbchurrasco-app.firebaseapp.com",
            projectId: "bbchurrasco-app",
            storageBucket: "bbchurrasco-app.firebasestorage.app",
            messagingSenderId: "470656170967",
            appId: "1:470656170967:web:f9c96614d411561ddfe992",
            measurementId: "G-C0KJ5GJKG2"
        };
        
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }

        // Lista de produtos atualizada com fotos reais de alta qualidade
        const produtos = [
            { id: 1, nome: "Picanha Nobre (Porção)", preco: 89.90, img: "https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=300&q=80" },
            { id: 2, nome: "Costela Bovina (Kg)", preco: 65.00, img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=300&q=80" },
            { id: 3, nome: "Cerveja Gelada 600ml", preco: 12.00, img: "https://images.unsplash.com/photo-1608270102525-45239e088cb3?auto=format&fit=crop&w=300&q=80" },
            { id: 4, nome: "Refrigerante Lata", preco: 6.00, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80" }
        ];

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            
            document.getElementById('login-error').classList.add('hidden');

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    initApp(userCredential.user.email);
                })
                .catch((error) => {
                    document.getElementById('login-error').classList.remove('hidden');
                });
        }

        function initApp(email) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            const isAdmin = email.includes('admin');
            
            if (!isAdmin) {
                // Se for garçom, esconde completamente a aba de relatórios
                document.getElementById('nav-relatorios').style.display = 'none';
                document.getElementById('user-role-label').innerText = 'B.B GARÇOM — Atendimento';
            } else {
                document.getElementById('user-role-label').innerText = 'B.B ADMIN — Gestão Completa';
            }

            renderMenu();
            renderMesas();
        }

        function renderMenu() {
            const container = document.getElementById('menu-list');
            container.innerHTML = produtos.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex items-center p-3 gap-3">
                    <img src="${p.img}" alt="${p.nome}" class="w-16 h-16 object-cover rounded-lg shadow-inner">
                    <div class="flex-1">
                        <h4 class="font-semibold text-sm text-gray-800">${p.nome}</h4>
                        <p class="text-red-700 font-bold text-sm mt-1">R$ ${p.preco.toFixed(2)}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderMesas() {
            const container = document.getElementById('grid-mesas');
            let html = '';
            for(let i = 1; i <= 9; i++) {
                html += `<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center cursor-pointer hover:border-red-600 transition">
                    <span class="text-2xl">🪑</span>
                    <h3 class="font-bold text-sm text-gray-800 mt-2">Mesa ${i}</h3>
                    <span class="text-xs text-emerald-600 font-medium">Livre</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        function switchTab(tab) {
            ['mesas', 'comandas', 'relatorios'].forEach(t => {
                const tabEl = document.getElementById(`tab-${t}`);
                const navEl = document.getElementById(`nav-${t}`);
                if (tabEl) tabEl.classList.add('hidden');
                if (navEl) {
                    navEl.classList.remove('text-red-700');
                    navEl.classList.add('text-gray-400');
                }
            });
            const activeTab = document.getElementById(`tab-${tab}`);
            const activeNav = document.getElementById(`nav-${tab}`);
            if (activeTab) activeTab.classList.remove('hidden');
            if (activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('text-red-700');
            }
        }

        function handleLogout() {
            firebase.auth().signOut().then(() => {
                location.reload();
            });
        }
    </script>
</body>
</html>
