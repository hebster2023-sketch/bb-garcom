<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b12f27">
<title>B.B GARÇOM — B.B CHURRASCO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--brand:#b12f29;--brand2:#8f241f;--ink:#193b29;--soft:#f4f7f4}
*{box-sizing:border-box} html,body{margin:0;background:#f5f6f7;color:#17231c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:92px}.app{max-width:760px;margin:auto;padding:14px 14px 100px}
.header{background:linear-gradient(145deg,#bd372f,#982720);color:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 12px 28px rgba(120,25,20,.18);position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;top:-75px;background:rgba(255,255,255,.08)}
.header h1{font-size:27px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:3px 0 0;font-size:14px;opacity:.9}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 11px}.section-title h2{font-size:21px;font-weight:900;color:var(--ink);margin:0}.muted{color:#6b756f}
.bottom{position:fixed;z-index:100;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #e7e9e7;display:grid;grid-template-columns:repeat(3,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px rgba(0,0,0,.08)}
.bottom button{border:0;background:none;color:#69716d;font-weight:800;font-size:12px;padding:7px 4px;border-radius:14px}.bottom button.active{color:var(--brand);background:#fff2f0}.bottom .ico{display:block;font-size:22px;line-height:23px;margin-bottom:2px}
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.table{min-height:116px;border-radius:20px;padding:15px 10px;border:2px solid #59bd69;background:#f0fbf2;color:#1f5130;box-shadow:0 5px 13px rgba(38,89,49,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}.table:active{transform:scale(.97)}.table.busy{border-color:#df5a53;background:#fff3f2;color:#8d2823}.table .num{font-size:20px;font-weight:900}.table .status{font-size:12px;font-weight:900;margin-top:5px}.table .total{font-size:13px;font-weight:900;margin-top:5px}
.card{background:#fff;border:1px solid #e8ece9;border-radius:20px;box-shadow:0 7px 20px rgba(26,38,30,.06)}.topbar{display:flex;gap:10px;align-items:center}.back{border:0;background:#eef1ef;border-radius:13px;padding:9px 12px;font-weight:900}.mesa-head{flex:1}.mesa-head h2{font-size:22px;font-weight:900;color:var(--ink);margin:0}.mesa-head p{margin:2px 0 0;font-size:12px;color:#707973}
.people{margin-top:12px;padding:12px;border-radius:16px;background:#f6f8f6;display:flex;align-items:center;justify-content:space-between}.people input{width:70px;border:1px solid #dfe5e0;border-radius:12px;padding:9px;text-align:center;font-weight:900;background:#fff}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 2px 10px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:#f5f6f7}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid #e1e5e2;background:#fff;color:#4e5953;border-radius:999px;padding:9px 13px;font-weight:800;font-size:12px}.cat.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{overflow:hidden;border-radius:19px;background:#fff;border:1px solid #e8ebe9;box-shadow:0 5px 16px rgba(20,30,24,.055)}.prod-img{height:108px;display:grid;place-items:center;background:linear-gradient(135deg,#eee,#ddd);font-size:50px}.prod-body{padding:11px}.prod-name{font-size:14px;font-weight:900;line-height:1.2;min-height:34px}.price{font-size:13px;font-weight:900;color:var(--brand);margin:5px 0 9px}.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty button{width:34px;height:34px;border:0;border-radius:11px;background:#eef1ef;font-weight:900;font-size:18px}.qty button.plus{background:var(--brand);color:#fff}.qty span{font-weight:900;min-width:20px;text-align:center}.selected{outline:2px solid #6bc278;outline-offset:-2px}
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:76px;width:min(720px,calc(100% - 24px));background:#193b29;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 25px rgba(25,59,41,.28)}.cartbar button{border:0;background:#fff;color:#193b29;border-radius:12px;padding:10px 14px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(10,18,13,.45);z-index:200;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:26px 26px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:21px;font-weight:900;color:var(--ink);margin:0}.close{border:0;background:#eef1ef;border-radius:12px;width:38px;height:38px;font-size:20px}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0ee}.line small{color:#68716c}.totalrow{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:15px 0}.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:15px;padding:14px;font-weight:900;font-size:15px}.secondary{width:100%;border:0;background:#eef3ef;color:#244532;border-radius:15px;padding:13px;font-weight:900;margin-top:8px}
.empty{padding:35px 15px;text-align:center;color:#79827d}.command{padding:16px;margin-bottom:10px}.command .row{display:flex;justify-content:space-between;gap:10px}.command h3{margin:0;font-size:18px;font-weight:900;color:var(--ink)}.tag{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#fff0ee;color:var(--brand)}
@media(max-width:420px){.tables{gap:8px}.table{min-height:108px}.products{gap:8px}.prod-img{height:96px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <h1>B.B CHURRASCO</h1>
  <p>B.B GARÇOM — Sistema de Atendimento</p>
</header>
<div id="conteudo"></div>
</div>

<div id="cartBar" class="cartbar" style="display:none">
  <div><strong id="cartCount">0 itens</strong><br><span id="cartTotal">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navComandas" onclick="mudarTela('comandas')"><span class="ico">📋</span>Comandas</button>
 <button onclick="alert('Relatórios e usuários serão adicionados na próxima etapa.')"><span class="ico">📊</span>Relatórios</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const cardapio={
"CHURRASCOS":[
["Frango",8,"🍗"],["Porco",8,"🥩"],["Linguiça",8,"🌭"],["Coração de frango",8,"🍢"],["Coração de boi",8,"🍢"],["Carne",8,"🥩"],["Tripa",8,"🥓"]],
"CARANGUEJO":[["Unidade",8,"🦀"],["Combo 4",28,"🦀"]],
"BEBIDAS":[["Skol",5,"🍺"],["Brahma Chopp",5,"🍺"],["Brahma Puro Malte",5,"🍺"],["Heineken",9,"🍺"],["Corona Extra",9,"🍺"],["Terça amarela",7,"🍻"],["Terça prata",6,"🍻"],["Meio litro amarela",16,"🍺"],["Meio litro prata",15,"🍺"],["Balde Skol",50,"🪣"],["Balde Brahma",50,"🪣"],["Budweiser",7.5,"🍺"],["Caipirinha",15,"🍹"]],
"REFRIGERANTES":[["Coca-Cola 1L",8,"🥤"],["Guaraná 1L",7,"🥤"],["Pepsi 1L",7,"🥤"],["Coca-Cola lata",5,"🥫"],["Fanta lata",5,"🥫"],["Sprite lata",6,"🥫"],["Água",3,"💧"],["Água com gás",4,"💧"]],
"PETISCOS":[["Batata frita",15,"🍟"],["Calabresa acebolada",15,"🍳"],["Camarão (porção)",25,"🍤"]],
"GUARNIÇÕES":[["Baião caseiro",8,"🍚"],["Baião cremoso",10,"🍲"]]
};
let comandas=JSON.parse(localStorage.getItem("bb_comandas"))||{};
let telaAtual="mesas",mesaSelecionada=null,pedidoTemp={},pessoasTemp=1,categoriaAtual="CHURRASCOS";

const br=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0");
function persist(){localStorage.setItem("bb_comandas",JSON.stringify(comandas))}
function mudarTela(t,num=null){telaAtual=t;if(num!==null)mesaSelecionada=Number(num);renderizar();scrollTo(0,0)}
function abrirMesa(num){mesaSelecionada=Number(num);pedidoTemp={};pessoasTemp=1;if(comandas[num]){pessoasTemp=comandas[num].pessoas||1;(comandas[num].itens||[]).forEach(i=>pedidoTemp[i.nome]=i.qtd)}mudarTela("atendimento",num)}
function atualizarPessoas(v){pessoasTemp=Math.max(1,parseInt(v)||1)}
function alterarQtd(nome,delta){pedidoTemp[nome]=(pedidoTemp[nome]||0)+delta;if(pedidoTemp[nome]<0)pedidoTemp[nome]=0;renderProdutos();atualizarBar()}
function produtosFlat(){let a=[];for(const cat in cardapio)cardapio[cat].forEach(p=>a.push({nome:p[0],preco:p[1],icon:p[2],cat}));return a}
function totalTemp(){return produtosFlat().reduce((s,p)=>s+(pedidoTemp[p.nome]||0)*p.preco,0)}
function itensTemp(){return produtosFlat().filter(p=>(pedidoTemp[p.nome]||0)>0).map(p=>({nome:p.nome,qtd:pedidoTemp[p.nome],preco:p.preco}))}
function atualizarBar(){const items=Object.values(pedidoTemp).reduce((a,b)=>a+b,0),total=totalTemp();const bar=document.getElementById("cartBar");if(telaAtual==="atendimento"&&items){bar.style.display="flex";document.getElementById("cartCount").textContent=`${items} ${items===1?"item":"itens"}`;document.getElementById("cartTotal").textContent=br(total)}else bar.style.display="none"}
function setCategoria(cat){categoriaAtual=cat;renderProdutos()}
function renderProdutos(){
 const el=document.getElementById("produtos");if(!el)return;
 el.innerHTML=cardapio[categoriaAtual].map(p=>{const [nome,preco,icon]=p,q=pedidoTemp[nome]||0;return `<div class="product ${q?"selected":""}">
 <div class="prod-img">${icon}</div><div class="prod-body"><div class="prod-name">${nome}</div><div class="price">${br(preco)}</div>
 <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`}).join("");
 document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat===categoriaAtual));atualizarBar();
}
function renderAtendimento(){
 const c=comandas[mesaSelecionada], total=totalTemp();
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div class="topbar" style="width:100%"><button class="back" onclick="mudarTela('mesas')">←</button><div class="mesa-head"><h2>Mesa ${pad(mesaSelecionada)}</h2><p>Atendimento em andamento</p></div><span class="tag">${br(total)}</span></div></div>
 <div class="card people"><span><b>👥 Pessoas na mesa</b><br><small class="muted">Quantidade de clientes</small></span><input id="pessoas" type="number" min="1" value="${pessoasTemp}" onchange="atualizarPessoas(this.value)"></div>
 <div class="section-title"><h2>Cardápio</h2><span class="muted">${itensTemp().reduce((s,i)=>s+i.qtd,0)} itens</span></div>
 <div class="cats">${Object.keys(cardapio).map(c=>`<button class="cat ${c===categoriaAtual?"active":""}" data-cat="${c}" onclick="setCategoria('${c}')">${c==="CHURRASCOS"?"🔥":c==="CARANGUEJO"?"🦀":c==="BEBIDAS"?"🍺":c==="REFRIGERANTES"?"🥤":c==="PETISCOS"?"🍟":"🍚"} ${c}</button>`).join("")}</div>
 <div id="produtos" class="products"></div>`;
 renderProdutos();
}
function salvarComanda(){
 const itens=itensTemp();if(!itens.length){alert("Adicione pelo menos um produto.");return}
 const total=itens.reduce((s,i)=>s+i.qtd*i.preco,0);
 comandas[mesaSelecionada]={pessoas:pessoasTemp,itens,total,atualizadoEm:Date.now()};
 persist();fecharModal();alert(`Mesa ${pad(mesaSelecionada)} salva com sucesso!`);mudarTela("mesas");
}
function abrirCarrinho(){const itens=itensTemp();document.getElementById("modalTitle").textContent=`Mesa ${pad(mesaSelecionada)} — Pedido`;document.getElementById("modalBody").innerHTML=`${itens.map(i=>`<div class="line"><div><b>${i.qtd}x ${i.nome}</b><br><small>${br(i.preco)} cada</small></div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}<div class="totalrow"><span>Total</span><span>${br(totalTemp())}</span></div><button class="primary" onclick="salvarComanda()">💾 Salvar comanda</button><button class="secondary" onclick="fecharModal()">Continuar adicionando</button>`;document.getElementById("modal").classList.add("show")}
function fecharModal(){document.getElementById("modal").classList.remove("show")}
function fecharMesa(num){const c=comandas[num];if(!c)return;if(confirm(`Fechar Mesa ${pad(num)} com total de ${br(c.total)}?`)){delete comandas[num];persist();renderizar()}}
function renderMesas(){
 let abertas=Object.keys(comandas).filter(k=>comandas[k]?.itens?.length).length;
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div><h2>Mesas</h2><span class="muted">${abertas} aberta${abertas===1?"":"s"} agora</span></div><span class="tag">30 mesas</span></div>
 <div class="tables">${Array.from({length:30},(_,i)=>{let n=i+1,c=comandas[n],busy=c?.itens?.length;return `<div class="table ${busy?"busy":""}" onclick="abrirMesa(${n})"><div class="num">Mesa ${pad(n)}</div><div class="status">${busy?"🔴 OCUPADA":"🟢 LIVRE"}</div>${busy?`<div class="total">${br(c.total)}</div><div style="font-size:10px;margin-top:2px">${c.pessoas||1} pessoa${(c.pessoas||1)>1?"s":""}</div>`:""}</div>`}).join("")}</div>`;
}
function renderComandas(){
 let abertas=Object.entries(comandas).filter(([m,c])=>c?.itens?.length);
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div><h2>Comandas abertas</h2><span class="muted">${abertas.length} mesa${abertas.length===1?"":"s"} em atendimento</span></div></div>
 ${abertas.length?abertas.map(([m,c])=>`<div class="card command"><div class="row"><h3>Mesa ${pad(m)}</h3><strong style="color:var(--brand)">${br(c.total)}</strong></div><p class="muted" style="font-size:12px;margin:4px 0 12px">👥 ${c.pessoas||1} pessoa${(c.pessoas||1)>1?"s":""}</p>${c.itens.map(i=>`<div class="row" style="font-size:13px;margin:5px 0"><span>${i.qtd}x ${i.nome}</span><b>${br(i.qtd*i.preco)}</b></div>`).join("")}<div style="display:flex;gap:8px;margin-top:13px"><button class="secondary" style="margin:0" onclick="abrirMesa(${m})">➕ Adicionar</button><button class="primary" style="background:#b12f29" onclick="fecharMesa(${m})">Fechar mesa</button></div></div>`).join(""):`<div class="card empty">📋<br><b>Nenhuma comanda aberta</b><br>As mesas com pedidos aparecerão aqui.</div>`}`;
}
function renderizar(){
 const navM=document.getElementById("navMesas"),navC=document.getElementById("navComandas");navM.classList.toggle("active",telaAtual==="mesas"||telaAtual==="atendimento");navC.classList.toggle("active",telaAtual==="comandas");
 if(telaAtual==="mesas")renderMesas();else if(telaAtual==="atendimento")renderAtendimento();else renderComandas();atualizarBar();
}
renderizar();
</script>
</body>
</html>
