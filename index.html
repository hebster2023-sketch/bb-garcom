<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>B.B GARÇOM — B.B CHURRASCO</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --brand: #ef4444;
  --brand-hover: #dc2626;
  --ink: #f3f4f6;
  --bg: #0d0f12;
  --card: rgba(30, 32, 38, 0.75);
  --border: rgba(255, 255, 255, 0.08);
  --muted: #9ca3af;
  --input-bg: rgba(20, 22, 27, 0.8);
}
[data-theme="light"] {
  --brand: #b12f29;
  --brand-hover: #8f241f;
  --ink: #14281e;
  --bg: #f4f7f5;
  --card: rgba(255, 255, 255, 0.85);
  --border: rgba(0, 0, 0, 0.08);
  --muted: #6c7a72;
  --input-bg: rgba(248, 250, 249, 0.9);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{padding-bottom:140px}.app{max-width:760px;margin:auto;padding:16px 16px 140px}

/* Header */
.header{background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 12px 30px rgba(239, 68, 68, 0.25);position:relative;overflow:hidden;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:11px;opacity:.9}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-btn, .sound-btn{background:rgba(255,255,255,.2);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .2s cubic-bezier(0.34, 1.56, 0.64, 1)}
.theme-btn:active, .sound-btn:active{transform:scale(.85)}
.sound-btn.active{background:rgba(16, 185, 129, 0.4);border:1px solid #10b981}

/* Toast Flutuante */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(90%, 400px);pointer-events:none}
.toast{background:rgba(31, 41, 55, 0.95);backdrop-filter:blur(8px);color:#fff;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;pointer-events:auto;animation: fadeInOut .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
[data-theme="light"] .toast{background:rgba(20, 40, 30, 0.95);color:#fff}
@keyframes fadeInOut { from{opacity:0;transform:translateY(-15px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }

/* Navegação Inferior */
.bottom{position:fixed;z-index:100;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:22px;box-shadow:0 15px 35px rgba(0,0,0,.2)}
.bottom button{border:0;background:none;color:var(--muted);font-weight:800;font-size:11px;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1);cursor:pointer}
.bottom button.active{color:var(--brand);background:rgba(239, 68, 68, 0.15);transform:translateY(-2px)}
.bottom button:active{transform:scale(0.92)}
.bottom .ico{font-size:18px;margin-bottom:2px}

/* Filtros de Mesas */
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap;transition:all .2s}
.filter-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(239,68,68,0.3)}

/* Grid de Mesas com Cores de Alerta Diferentes */
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.table{min-height:130px;border-radius:20px;padding:10px 6px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1);position:relative;overflow:hidden}
.table:hover{border-color:rgba(239,68,68,0.3);transform:translateY(-2px)}
.table:active{transform:scale(0.95)}
.table.busy{border-color:rgba(239, 68, 68, 0.35);background:linear-gradient(135deg, rgba(239, 68, 68, 0.08), var(--card))}

/* Estado 1: Novo Pedido (Cor Azulada/Ciano Destacada) */
.table.novo-pedido-ativo{border-color:#38bdf8 !important;background:linear-gradient(135deg, rgba(56, 189, 248, 0.2), var(--card)) !important;box-shadow:0 0 20px rgba(56, 189, 248, 0.4) !important;animation: pulseNovo 1.5s infinite}
@keyframes pulseNovo { 0%{transform:scale(1)} 50%{transform:scale(1.02)} 100%{transform:scale(1)} }

/* Estado 2: Pediu a Conta (Cor Amarela/Dourada Forte e Pulsante) */
.table.pediu-conta-ativo{border-color:#f59e0b !important;background:linear-gradient(135deg, rgba(245, 158, 11, 0.25), var(--card)) !important;box-shadow:0 0 25px rgba(245, 158, 11, 0.5) !important;animation: pulseConta 1.2s infinite}
@keyframes pulseConta { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }

/* Badges de Status Modernos */
.table .num{font-size:15px;font-weight:900}
.badge-status{font-size:9px;font-weight:900;margin-top:2px;padding:2px 8px;border-radius:99px;letter-spacing:.3px}
.badge-status.livre{background:rgba(16, 185, 129, 0.15);color:#10b981;border:1px solid rgba(16, 185, 129, 0.3)}
.badge-status.ocupada{background:rgba(239, 68, 68, 0.15);color:var(--brand);border:1px solid rgba(239, 68, 68, 0.3)}
.badge-status.novo{background:rgba(56, 189, 248, 0.2);color:#38bdf8;border:1px solid rgba(56, 189, 248, 0.4)}
.badge-status.conta{background:rgba(245, 158, 11, 0.2);color:#f59e0b;border:1px solid rgba(245, 158, 11, 0.4)}

.table .total{font-size:12px;font-weight:900;margin-top:3px;color:var(--brand)}
.table .timer{font-size:9px;margin-top:2px;font-weight:800;padding:1px 6px;border-radius:6px}
.timer.tempo-verde{background:rgba(16, 185, 129, 0.15);color:#10b981}
.timer.tempo-amarelo{background:rgba(245, 158, 11, 0.15);color:#f59e0b}
.timer.tempo-vermelho{background:rgba(239, 68, 68, 0.15);color:#ef4444}

.table .garcom-tag{font-size:9px;background:var(--input-bg);border:1px solid var(--border);padding:1px 6px;border-radius:6px;margin-top:3px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Cards Genéricos */
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.05);padding:16px;margin-bottom:12px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.section-title h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.muted{color:var(--muted);font-size:12px}

.topbar{display:flex;gap:12px;align-items:center}
.back{border:0;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--ink);border-radius:12px;width:38px;height:38px;font-weight:900;font-size:15px;display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.back:active{transform:scale(0.85)}
.mesa-head{flex:1}.mesa-head h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.mesa-head p{margin:2px 0 0;font-size:11px;color:var(--muted)}

/* Busca de Produtos */
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);background:var(--input-bg);backdrop-filter:blur(10px);color:var(--ink);border-radius:14px;font-size:12px;font-weight:700;outline:none;transition:all .2s}
.search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(239,68,68,0.15)}
.search-box span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}

/* Categorias */
.cats{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.02);cursor:pointer;transition:all .2s cubic-bezier(0.34, 1.56, 0.64, 1)}
.cat.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 14px rgba(239,68,68,0.3);transform:translateY(-1px)}
.cat:active{transform:scale(0.92)}

/* Cards de Produtos Modernos com Barra de Destaque */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{overflow:hidden;border-radius:18px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.03);transition:all .2s;position:relative}
.product.selected{border-color:var(--brand);box-shadow:0 6px 20px rgba(239,68,68,0.15)}
.product.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand);border-radius:4px 0 0 4px}

.prod-img{height:75px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--input-bg)}
.prod-body{padding:10px 10px 10px 12px}
.prod-name{font-size:13px;font-weight:900;line-height:1.2;min-height:32px;color:var(--ink)}
.prod-desc{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.price{font-size:13px;font-weight:900;color:var(--brand);margin:4px 0 8px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qty button{width:32px;height:32px;border:0;border-radius:10px;background:var(--input-bg);color:var(--ink);font-weight:900;font-size:16px;cursor:pointer;transition:transform .15s cubic-bezier(0.34, 1.56, 0.64, 1)}
.qty button:active{transform:scale(0.8)}
.qty button.plus{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(239,68,68,0.3)}
.qty span{font-weight:900;min-width:20px;text-align:center;font-size:14px;color:var(--ink)}

/* Barra Flutuante de Carrinho */
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%) translateY(100px);bottom:76px;width:min(700px,calc(100% - 24px));background:rgba(30, 41, 59, 0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 15px 35px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .3s ease;opacity:0}
.cartbar.show-cart{transform:translateX(-50%) translateY(0);opacity:1}
[data-theme="light"] .cartbar{background:rgba(20, 40, 30, 0.95)}
.cartbar button{border:0;background:#fff;color:#14281e;border-radius:12px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:13px;transition:transform .2s}
.cartbar button:active{transform:scale(0.92)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:end}
.modal.show{display:flex}
.sheet{background:var(--card);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);color:var(--ink);width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow:auto;box-shadow:0 -15px 50px rgba(0,0,0,0.4);border-top:1px solid var(--border);animation: slideUpModal .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
@keyframes slideUpModal { from{transform:translateY(100%)} to{transform:translateY(0)} }

.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}
.close{border:0;background:var(--input-bg);color:var(--ink);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;transition:transform .2s}
.close:active{transform:scale(0.85)}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.line small{color:var(--muted)}
.totalrow{display:flex;justify-content:space-between;font-size:17px;font-weight:900;padding:14px 0;border-top:2px dashed var(--border);margin-top:4px}
.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:14px;box-shadow:0 6px 18px rgba(239, 68, 68, 0.3);cursor:pointer;transition:transform .2s}
.primary:active{transform:scale(0.97)}
.secondary{width:100%;border:0;background:var(--input-bg);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:12px;font-weight:900;margin-top:6px;cursor:pointer;font-size:13px;transition:transform .2s}
.secondary:active{transform:scale(0.97)}
.empty{padding:30px 15px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
.command{padding:16px;margin-bottom:10px}
.command .row{display:flex;justify-content:space-between;gap:10px}
.command h3{margin:0;font-size:16px;font-weight:900;color:var(--ink)}
.tag{font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;background:rgba(239, 68, 68, 0.15);color:var(--brand);border:1px solid rgba(239,68,68,0.3)}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- TELA DE LOGIN -->
<div id="login-screen" style="position:fixed;inset:0;background:radial-gradient(circle at center, #1e2028 0%, #0d0f12 100%);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--card);backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:24px;padding:26px;width:100%;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:32px;margin-bottom:6px">🔥</div>
      <h2 style="font-size:20px;font-weight:900;margin:0;color:var(--ink)">B.B CHURRASCO</h2>
      <p style="font-size:11px;color:var(--muted);margin:4px 0 0">Faça login para acessar o sistema</p>
    </div>
    <form onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">E-mail</label>
        <input type="email" id="login-email" required style="width:100%;padding:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="ex: garcom@bbchurrasco.com">
      </div>
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">Senha</label>
        <input type="password" id="login-password" required style="width:100%;padding:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="••••••••">
      </div>
      <div id="login-error" style="color:#ef4444;font-size:11px;font-weight:800;text-align:center;display:none">E-mail ou senha incorretos.</div>
      <button type="submit" style="background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:13px;cursor:pointer;margin-top:4px;box-shadow:0 6px 18px rgba(239,68,68,0.3)">Entrar no Sistema</button>
    </form>
  </div>
</div>

<div class="app">
<header class="header">
  <div>
    <h1>B.B CHURRASCO</h1>
    <p id="user-role-label">B.B GARÇOM — Atendimento por Cliente</p>
  </div>
  <div class="header-actions">
    <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="Ativar/Desativar Alerta Sonoro">🔔</button>

<div id="conteudo"></div>
</div>

<div id="cartBar" class="cartbar">
  <div><strong id="cartCount" style="font-size:13px">0 itens</strong><br><span id="cartTotal" style="font-size:12px;opacity:.9">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navComandas" onclick="mudarTela('comandas')"><span class="ico">📋</span>Comandas</button>
 <button id="navRelatorios" onclick="mudarTela('relatorios')"><span class="ico">📊</span>Relatórios</button>
</nav>

 <div class="sheet">

  <div id="modalBody"></div>
 </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
  authDomain: "bbchurrasco-app.firebaseapp.com",
  projectId: "bbchurrasco-app",
  storageBucket: "bbchurrasco-app.firebasestorage.app",
  messagingSenderId: "470656170967",
  appId: "1:470656170967:web:f9c96614d411561ddfe992",
  measurementId: "G-C0KJ5GJKG2"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db = firebase.firestore();
db.enablePersistence().catch(() => {});

let somAtivo = false;
let primeiraCargaFirebase = true;

function toggleSound(){
  somAtivo = !somAtivo;
  const btn = document.getElementById('soundToggleBtn');
  if(somAtivo){
    btn.classList.add('active');
    btn.textContent = '🔊';
    showToast("Alerta sonoro ativado com sucesso!");
    falarTexto("Sistema de alerta de pedidos ativado.");
  } else {
    btn.classList.remove('active');
    btn.textContent = '🔔';
    showToast("Alerta sonoro desativado.");
  }
}

function falarTexto(texto){
  if(!somAtivo || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.05;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

// Verificação inteligente de alertas diferenciados (Novo Pedido vs Pedir Conta)
function processarAlertaPedido(mesaId, atual) {
  if (!somAtivo) return;

  // 1. Alerta de Pedir a Conta (Prioridade máxima / Cor amarela)
  if (atual && atual.pediuContaAlerta) {
    let textoFalar = `Atenção! A Mesa ${mesaId} solicitou a conta.`;
    showToast(`⚠️ Mesa ${pad(mesaId)} pediu a conta!`);
    falarTexto(textoFalar);
    return; // Evita conflito com o aviso de novo pedido comum
  }

  // 2. Alerta de Novo Pedido (Cor azul/ciano)
  if (atual && atual.novoPedidoAlerta && Array.isArray(atual.itens) && atual.itens.length > 0) {
    let textoFalar = `Novo pedido na Mesa ${mesaId}`;
    showToast(`🔔 Novo pedido na Mesa ${pad(mesaId)}!`);
    falarTexto(textoFalar);

    db.collection('comandas').doc(String(mesaId)).update({ 
      novoPedidoAlerta: false 
    }).catch(error => {
      console.error("Erro ao limpar flag de novo pedido:", error);
    });
  }
}

function verificarNovosPedidos(novasComandas){
  if(primeiraCargaFirebase){
    primeiraCargaFirebase = false;
    return;
  }

  for(const mesaId in novasComandas){
    const atual = novasComandas[mesaId];
    processarAlertaPedido(mesaId, atual);
  }
}

// Tema Claro/Escuro
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggleBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', next === 'dark' ? '#0d0f12' : '#b12f27');
  localStorage.setItem('bb_theme', next);
}
const savedTheme = localStorage.getItem('bb_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('themeToggleBtn');

function showToast(msg, isError = false){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #10b981';
  t.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .3s ease';
    setTimeout(() => t.remove(), 300);
  }, 2500);
}

let comandas = {};
let historicoVendas = [];
let despesas = [];
let cancelamentos = [];
let telaAtual = "mesas", mesaSelecionada = null, pedidoTemp = {}, clienteAtual = "Cliente 1", garcomTemp = "Hebster", categoriaAtual = "CHURRASCOS";
let filtroMesaAtual = "todas";
let termoBuscaProduto = "";
let usuarioLogadoEmail = "";

const br = v => (v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");

function iniciarOuvintesFirebase() {
  db.collection("comandas").onSnapshot(snapshot => {
    let novasComandas = {};
    snapshot.forEach(doc => { 
      let id = doc.id;
      let num = parseInt(id);
      if(isNaN(num) || num < 1 || num > 30 || String(num) !== String(id).trim()){
        db.collection("comandas").doc(id).delete().catch(()=>{});
        return;
      }
      novasComandas[id] = doc.data(); 
    });
    
    verificarNovosPedidos(novasComandas);
    comandas = novasComandas;

    if(telaAtual === "mesas" || telaAtual === "comandas") renderizar();
  }, err => console.error(err));

  db.collection("historico").onSnapshot(snapshot => {
    historicoVendas = [];
    snapshot.forEach(doc => { historicoVendas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));

  db.collection("despesas").onSnapshot(snapshot => {
    despesas = [];
    snapshot.forEach(doc => { despesas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));

  db.collection("cancelamentos").onSnapshot(snapshot => {
    cancelamentos = [];
    snapshot.forEach(doc => { cancelamentos.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));
}

function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((userCredential)=>{
      usuarioLogadoEmail = userCredential.user.email;
      concluirLogin(usuarioLogadoEmail);
    })
    .catch(()=>{
      document.getElementById('login-error').style.display = 'block';
    });
}

function concluirLogin(email){
  document.getElementById('login-screen').style.display = 'none';
  const isAdmin = email.toLowerCase().includes('admin');
  
  if(!isAdmin){
    document.getElementById('navRelatorios').style.display = 'none';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(2,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B GARÇOM — Atendimento por Cliente';
    if(telaAtual === 'relatorios') telaAtual = 'mesas';
  } else {
    document.getElementById('navRelatorios').style.display = 'flex';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(3,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B ADMIN — Gestão Completa';
  }
  iniciarOuvintesFirebase();
  renderizar();
}

function mudarTela(t, num=null){
  if(t === 'relatorios' && usuarioLogadoEmail && !usuarioLogadoEmail.toLowerCase().includes('admin')) return;
  telaAtual = t; if(num !== null) mesaSelecionada = Number(num); renderizar(); scrollTo(0,0);
}

function abrirMesa(num){
  mesaSelecionada = Number(num); pedidoTemp = {}; clienteAtual = "Cliente 1"; garcomTemp = "Hebster"; termoBuscaProduto = "";
  
  // Ao abrir a mesa, limpa os alertas pendentes (novo pedido ou pediu conta)
  if(comandas[num] && (comandas[num].novoPedidoAlerta || comandas[num].pediuContaAlerta)){
    db.collection("comandas").doc(String(num)).update({
      novoPedidoAlerta: false,
      pediuContaAlerta: false
    }).catch(()=>{});
  }

  if(comandas[num]){
    garcomTemp = comandas[num].garcom || "Hebster";
    if(comandas[num].itens){
      comandas[num].itens.forEach(it => {
        let cli = it.cliente || "Cliente 1";
        if(!pedidoTemp[cli]) pedidoTemp[cli] = {};
        pedidoTemp[cli][it.nome] = (pedidoTemp[cli][it.nome] || 0) + it.qtd;
      });
    }
  }
  mudarTela("atendimento", num);
}

function atualizarGarcom(v){ 
  garcomTemp = v.trim() || "Hebster"; 
  salvarRascunhoAutomatico();
}

function mudarClienteAtual(novoCli){
  clienteAtual = novoCli.trim() || "Cliente 1";
  renderAtendimento();
}

function renomearClienteAtual(){
  let novoNome = prompt(`Renomear "${clienteAtual}" para:`, clienteAtual);
  if(!novoNome || !novoNome.trim()) return;
  novoNome = novoNome.trim();
  if(novoNome === clienteAtual) return;
  
  if(pedidoTemp[novoNome]){
    showToast("Já existe uma pessoa com esse nome.", true);
    return;
  }
  
  pedidoTemp[novoNome] = pedidoTemp[clienteAtual] || {};
  delete pedidoTemp[clienteAtual];
  clienteAtual = novoNome;
  renderAtendimento();
  salvarRascunhoAutomatico();
}

function salvarRascunhoAutomatico(){
  if(telaAtual !== "atendimento" || !mesaSelecionada) return;
  const itens = itensTempComClientes();
  const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
  if(!itens.length && !comandas[mesaSelecionada]) return;

  const dadosMesa = { 
    garcom: garcomTemp, 
    itens: itens.length ? itens : (comandas[mesaSelecionada]?.itens || []), 
    total: itens.length ? total : (comandas[mesaSelecionada]?.total || 0), 
    criadoEm: comandas[mesaSelecionada]?.criadoEm || Date.now(),
    atualizadoEm: Date.now() 
  };

  db.collection("comandas").doc(String(mesaSelecionada)).set(dadosMesa, { merge: true }).catch(()=>{});
}

function alterarQtd(nome, delta){ 
  if(!pedidoTemp[clienteAtual]) pedidoTemp[clienteAtual] = {};
  pedidoTemp[clienteAtual][nome] = (pedidoTemp[clienteAtual][nome] || 0) + delta; 
  if(pedidoTemp[clienteAtual][nome] < 0) pedidoTemp[clienteAtual][nome] = 0; 
  renderProdutos(); 
  atualizarBar(); 
  salvarRascunhoAutomatico(); 
}

function produtosFlat(){ let a = []; for(const cat in cardapio) cardapio[cat].forEach(p => a.push({nome:p[0], preco:p[1], svg:p[2], desc:p[3], cat})); return a; }

function itensTempComClientes(){
  let arr = [];
  for(const cli in pedidoTemp){
    for(const prod in pedidoTemp[cli]){
      let qtd = pedidoTemp[cli][prod];
      if(qtd > 0){
        let pObj = produtosFlat().find(p => p.nome === prod);
        let preco = pObj ? pObj.preco : 0;
        arr.push({ cliente: cli, nome: prod, qtd: qtd, preco: preco });
      }
    }
  }
  return arr;
}

function totalTemp(){ 
  let itens = itensTempComClientes();
  return itens.reduce((s,i) => s + i.qtd * i.preco, 0);
}

function atualizarBar(){
  const itensArr = itensTempComClientes();
  const total = totalTemp();
  const totalItens = itensArr.reduce((a,b) => a+b.qtd, 0);
  const bar = document.getElementById("cartBar");
  if(telaAtual === "atendimento" && totalItens){
    bar.classList.add("show-cart");
    document.getElementById("cartCount").textContent = `${totalItens} ${totalItens === 1 ? "item" : "itens"}`;
    document.getElementById("cartTotal").textContent = br(total);
  } else {
    bar.classList.remove("show-cart");
  }
}

function setCategoria(cat){ categoriaAtual = cat; renderProdutos(); }
function filtrarProdutosInput(val){ termoBuscaProduto = val.toLowerCase().trim(); renderProdutos(); }

function renderProdutos(){
 const el = document.getElementById("produtos"); if(!el) return;
 let cliMap = pedidoTemp[clienteAtual] || {};
 
 let listaProd = cardapio[categoriaAtual];
 if(termoBuscaProduto){
   listaProd = produtosFlat().filter(p => p.nome.toLowerCase().includes(termoBuscaProduto));
 }

 el.innerHTML = listaProd.map(p => {
   const [nome, preco, svg, desc] = p, q = cliMap[nome] || 0;
   return `<div class="product ${q ? "selected" : ""}">
   <div class="prod-img">${svg}</div><div class="prod-body"><div class="prod-name">${nome}</div>${desc ? `<div class="prod-desc">${desc}</div>` : ''}<div class="price">${br(preco)}</div>
   <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`;
 }).join("");
 
 if(!termoBuscaProduto) {
   document.querySelectorAll(".cat").forEach(x => x.classList.toggle("active", x.dataset.cat === categoriaAtual));
 }
 atualizarBar();
}

function adicionarNovoClientePrompt(){
  let nomeCli = prompt("Digite o nome ou apelido da nova pessoa (ex: João, Maria):");
  if(!nomeCli || !nomeCli.trim()) return;
  nomeCli = nomeCli.trim();
  if(!pedidoTemp[nomeCli]) pedidoTemp[nomeCli] = {};
  clienteAtual = nomeCli;
  renderAtendimento();
}

function salvarComanda(){
 const itens = itensTempComClientes(); if(!itens.length){ showToast("Adicione pelo menos um produto.", true); return; }
 const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
 const itensPagosAntigos = comandas[mesaSelecionada]?.itensPagos || [];
 const criadoEmOriginal = comandas[mesaSelecionada]?.criadoEm || Date.now();
 
 // Ativa a flag novoPedidoAlerta = true para destacar na tela do garçom
 const dadosMesa = { garcom: garcomTemp, itens, itensPagos: itensPagosAntigos, total, criadoEm: criadoEmOriginal, atualizadoEm: Date.now(), novoPedidoAlerta: true };

 db.collection("comandas").doc(String(mesaSelecionada)).set(dadosMesa, { merge: true })
   .then(() => {
     fecharModal();
     showToast(`Mesa ${pad(mesaSelecionada)} salva com sucesso!`);
     mudarTela("mesas");
   })
   .catch(err => { showToast("Erro ao salvar: " + err.message, true); });
}

 document.getElementById("modalBody").innerHTML = `${itens.map(i => `<div class="line"><div><b>[${i.cliente}]</b> ${i.qtd}x ${i.nome}<br><small>${br(i.preco)} cada</small></div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}<div class="totalrow"><span>Total da Mesa</span><span>${br(totalTemp())}</span></div><button class="primary" onclick="salvarComanda()">💾 Confirmar e Salvar Pedido</button><button class="secondary" onclick="fecharModal()">Continuar adicionando</button>`;

function fecharModal(){ document.getElementById("modal").classList.remove("show"); }

function abrirModalTransferencia(numOrigem){
  const c = comandas[numOrigem];
  if(!c){ showToast("Esta mesa está vazia para transferir.", true); return; }
  
  let opcoesMesas = "";
  for(let i=1; i<=30; i++){
    if(i !== numOrigem){
      let ocupadaStr = comandas[i] ? " (Ocupada)" : " (Livre)";
      opcoesMesas += `<option value="${i}">Mesa ${pad(i)}${ocupadaStr}</option>`;
    }
  }

  document.getElementById("modalTitle").textContent = `Transferir Mesa ${pad(numOrigem)}`;
  document.getElementById("modalBody").innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Selecione para qual mesa deseja transferir todos os itens e o saldo da Mesa ${pad(numOrigem)}:</div>
    <div style="margin-bottom:14px">
      <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">Mesa de Destino</label>
      <select id="selectMesaDestino" style="width:100%;padding:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;outline:none">${opcoesMesas}</select>
    </div>
    <button class="primary" onclick="executarTransferencia(${numOrigem})">🔄 Confirmar Transferência</button>
    <button class="secondary" onclick="fecharModal()">Voltar</button>
  `;
  document.getElementById("modal").classList.add("show");
}

function executarTransferencia(numOrigem){
  const destSelect = document.getElementById("selectMesaDestino");
  if(!destSelect) return;
  const numDestino = parseInt(destSelect.value);
  const dadosOrigem = comandas[numOrigem];

  if(!dadosOrigem) return;

  const dadosDestinoExistente = comandas[numDestino];
  
  let itensCombinados = [...(dadosOrigem.itens || [])];
  let itensPagosCombinados = [...(dadosOrigem.itensPagos || [])];
  let totalCombinado = dadosOrigem.total || 0;
  let garcomNovo = dadosOrigem.garcom;
  let criadoEmNovo = dadosOrigem.criadoEm || Date.now();

  if(dadosDestinoExistente){
    itensCombinados = [...(dadosDestinoExistente.itens || []), ...itensCombinados];
    itensPagosCombinados = [...(dadosDestinoExistente.itensPagos || []), ...itensPagosCombinados];
    totalCombinado += (dadosDestinoExistente.total || 0);
  }

  const batch = db.batch();
  const refDestino = db.collection("comandas").doc(String(numDestino));
  const refOrigem = db.collection("comandas").doc(String(numOrigem));

  batch.set(refDestino, {
    garcom: garcomNovo,
    itens: itensCombinados,
    itensPagos: itensPagosCombinados,
    total: totalCombinado,
    criadoEm: criadoEmNovo,
    atualizadoEm: Date.now()
  });

  batch.delete(refOrigem);

  batch.commit().then(() => {
    fecharModal();
    showToast(`Mesa ${pad(numOrigem)} transferida com sucesso para a Mesa ${pad(numDestino)}!`);
    renderizar();
  }).catch(err => {
    showToast("Erro ao transferir: " + err.message, true);
  });
}

function mudarQtdPagamento(idx, delta, maxQtd){
  let span = document.getElementById(`qtd-pagar-${idx}`);
  if(!span) return;
  let atual = parseInt(span.textContent) || 0;
  let novo = atual + delta;
  if(novo < 0) novo = 0;
  if(novo > maxQtd) novo = maxQtd;
  span.textContent = novo;
  calcularValorSelecionadoComControle();
}

function calcularValorSelecionadoComControle(){
  let totalSel = 0;
  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtd = parseInt(span.textContent) || 0;
    let preco = parseFloat(span.dataset.preco) || 0;
    totalSel += qtd * preco;
  });
  document.getElementById('lblTotalSelecionado').textContent = br(totalSel);
}

function pagarItensSelecionados(num){
  const c = comandas[num]; if(!c) return;
  const formaPagamento = document.getElementById('formaPagamentoSelect')?.value || 'Pix';
  let valTotalSel = 0;
  let baixas = {};
  let temSelecao = false;

  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtdPagar = parseInt(span.textContent) || 0;
    if(qtdPagar > 0){
      temSelecao = true;
      let nome = span.dataset.nome;
      let cli = span.dataset.cliente;
      let preco = parseFloat(span.dataset.preco);
      valTotalSel += qtdPagar * preco;
      let chave = cli + "_" + nome;
      baixas[chave] = (baixas[chave] || 0) + qtdPagar;
    }
  });

  if(!temSelecao){ showToast("Selecione a quantidade de um item.", true); return; }

  if(confirm(`Confirmar pagamento de ${br(valTotalSel)} via ${formaPagamento}?`)){
    let itensPagosParaHistorico = [];
    let novosItens = [];
    let itensPagosAcumulados = c.itensPagos ? [...c.itensPagos] : [];

    c.itens.forEach(it => {
      let cli = it.cliente || "Cliente 1";
      let chave = cli + "_" + it.nome;
      let qtdBaixada = baixas[chave] || 0;
      if(qtdBaixada > 0){
        baixas[chave] -= qtdBaixada;
        itensPagosParaHistorico.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco });
        let jaExiste = itensPagosAcumulados.find(ip => ip.cliente === cli && ip.nome === it.nome);
        if(jaExiste){ jaExiste.qtd += qtdBaixada; }
        else { itensPagosAcumulados.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco }); }
      }
      let qtdRestante = it.qtd - qtdBaixada;
      if(qtdRestante > 0) novosItens.push({ cliente: cli, nome: it.nome, qtd: qtdRestante, preco: it.preco });
    });

    const vendaParcial = { mesa: num, total: valTotalSel, pagamento: formaPagamento, garcom: c.garcom || "Geral", itens: itensPagosParaHistorico, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
    let novoTotal = Math.max(0, c.total - valTotalSel);

    db.collection("historico").add(vendaParcial).then(() => {
      db.collection("comandas").doc(String(num)).update({ total: novoTotal, itens: novosItens, itensPagos: itensPagosAcumulados, atualizadoEm: Date.now() }).then(() => {
        fecharModal(); 
        showToast(`Baixa de ${br(valTotalSel)} (${formaPagamento}) realizada!`); 
        renderizar();
      });
    });
  }
}

function abaterValorEspecifico(num){
  const c = comandas[num]; if(!c) return;
  const input = document.getElementById('inputValorAbater');
  const formaPagamento = document.getElementById('formaPagamentoSelect')?.value || 'Pix';
  if(!input) return;
  let valorAbater = parseFloat(input.value);
  if(isNaN(valorAbater) || valorAbater <= 0){
    showToast("Digite um valor válido para abater.", true);
    return;
  }
  if(valorAbater > c.total){
    showToast("O valor a abater não pode ser maior que o total restante da comanda.", true);
    return;
  }

  if(confirm(`Confirmar abatimento de ${br(valorAbater)} via ${formaPagamento} na Mesa ${pad(num)}?`)){
    const vendaParcial = { mesa: num, total: valorAbater, pagamento: formaPagamento, garcom: c.garcom || "Geral", itens: [{ cliente: "Geral", nome: "Pagamento por Valor Específico", qtd: 1, preco: valorAbater }], horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
    let novoTotal = Math.max(0, c.total - valorAbater);

    db.collection("historico").add(vendaParcial).then(() => {
      db.collection("comandas").doc(String(num)).update({ total: novoTotal, atualizadoEm: Date.now() }).then(() => {
        fecharModal();
        showToast(`Abatimento de ${br(valorAbater)} realizado!`);
        renderizar();
      });
    });
  }
}

  let motivo = prompt(`Motivo do cancelamento da Mesa ${pad(num)}:`, "Desistência do cliente / Erro no pedido");

  let registroCancelamento = {
    mesa: num,
    garcom: c.garcom || "Desconhecido",

    motivo: motivo.trim() || "Não informado",

  db.collection("cancelamentos").add(registroCancelamento).then(() => {

function limparRelatorios(){
  if(confirm("Deseja zerar os relatórios do dia?")){
    const batch = db.batch();
    db.collection("historico").get().then(snap => {
      snap.docs.forEach(d => batch.delete(d.ref));
      db.collection("despesas").get().then(snap2 => {
        snap2.docs.forEach(d => batch.delete(d.ref));
        db.collection("cancelamentos").get().then(snap3 => {
          snap3.docs.forEach(d => batch.delete(d.ref));
          batch.commit().then(() => {
            showToast("Relatórios zerados com sucesso!");
            renderRelatorios();
          });
        });
      });
    });
  }
}

function calcularTempoDecorrido(timestampCriacao){
  if(!timestampCriacao) return { texto: "Aberto agora", classe: "tempo-verde" };
  let diffMinutos = Math.floor((Date.now() - timestampCriacao) / 60000);
  let classe = "tempo-verde";
  if(diffMinutos >= 30 && diffMinutos < 60) classe = "tempo-amarelo";
  else if(diffMinutos >= 60) classe = "tempo-vermelho";

  if(diffMinutos < 1) return { texto: "Há instantes", classe };
  if(diffMinutos < 60) return { texto: `Há ${diffMinutos} min`, classe };
  let horas = Math.floor(diffMinutos / 60);
  let mins = diffMinutos % 60;
  return { texto: `Há ${horas}h ${mins > 0 ? mins + 'm' : ''}`, classe };
}

  </div>

  <div style="margin-bottom:10px"><button class="primary" onclick="adicionarDespesa()" style="font-size:13px;padding:12px">➕ Registrar Gasto</button></div>

  <div class="section-title"><h2>💳 Faturamento por Forma de Pagamento</h2></div>
  <div class="card">
    ${Object.keys(pagamentosTotais).length ? Object.entries(pagamentosTotais).map(([meio, val]) => `
      <div class="line">
        <span><b>${meio}</b></span>
        <strong style="color:var(--brand)">${br(val)}</strong>
      </div>
    `).join("") : `<div class="empty" style="padding:10px">Nenhum pagamento registrado.</div>`}
  </div>

  <div class="section-title"><h2>📦 Total Consolidado de Produtos</h2></div>
  <div class="card">
    ${produtosOrdenados.length ? produtosOrdenados.map(([nome, qtd]) => `
      <div class="line">
        <span>${nome}</span>
        <strong style="color:var(--brand)">${qtd}x</strong>
      </div>
    `).join("") : `<div class="empty" style="padding:10px">Nenhum produto vendido ainda.</div>`}
  </div>

  <div class="section-title"><h2>⚠️ Registro de Cancelamentos</h2></div>
  <div class="card">
    ${cancelamentos.length ? cancelamentos.map(c => `
      <div class="line" style="flex-direction:column;align-items:flex-start;gap:2px">
        <div style="display:flex;justify-content:space-width;width:100%;justify-content:space-between">
          <strong style="color:var(--brand)">Mesa ${pad(c.mesa)} (${c.garcom})</strong>
          <span style="font-size:11px;color:var(--muted)">${c.horario}</span>
        </div>
        <div style="font-size:12px"><b>Motivo:</b> ${c.motivo}</div>
        <div style="font-size:11px;color:var(--muted)">Valor estornado/cancelado: <b>${br(c.totalCancelado)}</b></div>
      </div>
    `).join("") : `<div class="empty" style="padding:10px">Nenhum cancelamento registrado.</div>`}
  </div>

  <div class="section-title"><h2>Gastos</h2></div>
  <div class="card">${despesas.length ? despesas.map(d => `<div class="line"><div><b>${d.desc}</b><br><small>${d.horario}</small></div><strong style="color:var(--brand)">- ${br(d.valor)}</strong></div>`).join("") : `<div class="empty" style="padding:10px">Nenhum gasto.</div>`}</div>
  
  <div class="section-title"><h2>Histórico de Vendas por Comanda</h2></div>
  <div class="card">${historicoVendas.length ? historicoVendas.map(v => `<div class="line"><div><b>Mesa ${pad(v.mesa)}</b> (${v.garcom} • ${v.pagamento || 'Pix'})<br><small>${v.horario} • ${(v.itens||[]).map(i=>`[${i.cliente}] ${i.qtd}x ${i.nome}`).join(", ")}</small></div><strong style="color:var(--brand)">${br(v.total)}</strong></div>`).join("") : `<div class="empty" style="padding:10px">Nenhuma venda.</div>`}</div>`;
}

function renderizar(){
 const navM = document.getElementById("navMesas"), navC = document.getElementById("navComandas");
 navM.classList.toggle("active", telaAtual === "mesas" || telaAtual === "atendimento");
 navC.classList.toggle("active", telaAtual === "comandas");
 if(usuarioLogadoEmail && usuarioLogadoEmail.toLowerCase().includes('admin')){
   const navR = document.getElementById("navRelatorios");
   if(navR) navR.classList.toggle("active", telaAtual === "relatorios");
 }
 if(telaAtual === "mesas") renderMesas();
 else if(telaAtual === "atendimento") renderAtendimento();
 else if(telaAtual === "comandas") renderComandas();
 else if(telaAtual === "relatorios") renderRelatorios();
 atualizarBar();
}
</script>
</body>
</html>
