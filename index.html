  const ehTodas = modoFiltroRelatorio === 'TODAS';

  const vendasFiltradas = historicoVendas.filter(v => registroDentroDoPeriodo(v));
  const despesasFiltradas = despesas.filter(d => registroDentroDoPeriodo(d));
  const cancelamentosFiltrados = cancelamentos.filter(c => registroDentroDoPeriodo(c));

  let totalPix = 0, totalCredito = 0, totalDebito = 0, totalDinheiro = 0, totalGeral = 0;
  let vendasPorGarcom = {}; // Resumo agrupado por garçom (sem 10%)
  
  vendasFiltradas.forEach(v => {
    let t = Number(v.total) || 0;
    totalGeral += t;
    if(v.pagamento === 'Pix') totalPix += t;
    else if(v.pagamento === 'Cartão de Crédito') totalCredito += t;
    else if(v.pagamento === 'Cartão de Débito') totalDebito += t;
    else if(v.pagamento === 'Dinheiro') totalDinheiro += t;

    const gNome = (v.garcom || "Sem Garçom").trim() || "Sem Garçom";
    if (!vendasPorGarcom[gNome]) vendasPorGarcom[gNome] = { total: 0, atendimentos: 0 };
    vendasPorGarcom[gNome].total += t;
    vendasPorGarcom[gNome].atendimentos += 1;

  let totalDespesas = despesasFiltradas.reduce((acc, d) => acc + (Number(d.valor) || 0), 0);

function calcularStatusTempo(criadoEm){
  if(!criadoEm) return { texto: "", classe: "" };
  const diffMin = Math.floor((Date.now() - criadoEm) / 60000);
  if(diffMin < 1) return { texto: "Agora", classe: "tempo-verde" };
  let classe = "tempo-verde";
  if(diffMin >= 20 && diffMin < 45) classe = "tempo-amarelo";
  else if(diffMin >= 45) classe = "tempo-vermelho";
  
  let horas = Math.floor(diffMin / 60);
  let mins = diffMin % 60;
  let txt = horas > 0 ? `${horas}h ${mins}m` : `${mins}m`;
  return { texto: txt, classe };
}

function obterTimestampUltimoPedido(c) {
  if (!c) return 0;
  let ultimo = 0;
  if (Array.isArray(c.itens) && c.itens.length > 0) {
    c.itens.forEach(it => {
      const ts = Number(it.timestampItem || 0);
      if (ts > ultimo) ultimo = ts;
    });
  }
  if (!ultimo) {
    ultimo = Number(c.atualizadoEm || c.criadoEm || 0);
  }
  return ultimo;
}

function renderMesas(){
 let html = "", ocupadasCount = 0;
 const termoGarcomAtivo = (garcomSessao || garcomTemp || "").trim().toLowerCase();

 for(let i=1;i<=TOTAL_MESAS;i++){
  const c = comandas[i];
  const ocup = Boolean(c);
  if(ocup) ocupadasCount++;
  
  if(filtroMesaAtual === "livres" && ocup) continue;
  if(filtroMesaAtual === "ocupadas" && !ocup) continue;
  if(filtroMesaAtual === "minhas"){
    if(!ocup) continue;
    if(!termoGarcomAtivo) continue;
    const garcomMesa = (c.garcom || "").trim().toLowerCase();
    if(!garcomMesa.includes(termoGarcomAtivo)) continue;
  }
  
  const tempoInfo = ocup ? calcularStatusTempo(c.criadoEm) : { texto: "", classe: "" };
  const novoPedidoClasse = (ocup && c.novoPedidoAlerta) ? "novo-pedido-ativo" : "";
  const pediuContaClasse = (ocup && c.pediuContaAlerta) ? "pediu-conta-ativo" : "";
  const ehPedidoCliente = (ocup && c.origemPedido === 'cliente');

  let alertaMesaParadaHTML = "";
  if (ocup && !c.pediuContaAlerta) {
    const ultimoTs = obterTimestampUltimoPedido(c);
    if (ultimoTs > 0) {
      const minsParada = Math.floor((Date.now() - ultimoTs) / 60000);
      if (minsParada >= 25) {
        const horasP = Math.floor(minsParada / 60);
        const minsResto = minsParada % 60;
        const tempoParadaTxt = horasP > 0 ? `${horasP}h ${minsResto}m` : `${minsParada}m`;
        alertaMesaParadaHTML = `<div class="alerta-parada">⏳ Sem pedir há ${tempoParadaTxt}</div>`;
      }
    }
  }

  html += `<div class="table card-mesa ${ocup?"ocupada busy":"livre"} ${novoPedidoClasse} ${pediuContaClasse}" onclick="abrirMesa(${i})">
    ${ehPedidoCliente ? '<div style="font-size:10px;background:#38bdf8;color:#fff;padding:2px 6px;border-radius:6px;font-weight:900;margin-bottom:3px">📱 CLIENTE</div>' : ''}

    <span class="badge-status ${ocup?"ocupada":"livre"}">${ocup ? "Ocupada" : "Livre"}</span>
    <div class="total">${ocup ? br(c.total) : "R$ 0,00"}</div>
    ${ocup ? `
      ${c.garcom ? `<span class="garcom-tag">👤 ${escapeHTML(c.garcom)}</span>` : ""}
      ${tempoInfo.texto ? `<span class="timer ${tempoInfo.classe}">⏱️ ${tempoInfo.texto}</span>` : ""}
      ${alertaMesaParadaHTML}
    ` : ""}
  </div>`;
 }
 document.getElementById("conteudo").innerHTML = `
  <div class="section-title"><h2>Salão — 45 Mesas</h2><span class="muted">${ocupadasCount} ocupadas</span></div>
  <div class="filter-tabs">

    <button class="filter-tab ${filtroMesaAtual==="livres"?"active":""}" onclick="mudarFiltroMesa('livres')">Livres (${TOTAL_MESAS - ocupadasCount})</button>
    <button class="filter-tab ${filtroMesaAtual==="ocupadas"?"active":""}" onclick="mudarFiltroMesa('ocupadas')">Ocupadas (${ocupadasCount})</button>
    <button class="filter-tab ${filtroMesaAtual==="minhas"?"active":""}" onclick="mudarFiltroMesa('minhas')">👤 Minhas Mesas${termoGarcomAtivo ? ` (${escapeHTML(garcomSessao || garcomTemp)})` : ''}</button>
  </div>

}

    ` : ''}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)">Pessoa da Mesa (${clienteAtual})</label>
      <div style="display:flex;gap:6px">
        <button onclick="renomearClienteAtual()" style="border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:10px;padding:4px 8px;font-size:10px;font-weight:900;cursor:pointer">✏️ Renomear</button>
        <button onclick="adicionarNovoClientePrompt()" style="border:0;background:var(--brand);color:#fff;border-radius:10px;padding:4px 10px;font-size:10px;font-weight:900;cursor:pointer">+ Nova Pessoa</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
      ${listaClientes.map(cli => `
        <button onclick="mudarClienteAtual('${escapeHTML(cli)}')" style="padding:6px 12px;border-radius:12px;border:1px solid ${cli===clienteAtual?'var(--brand)':'var(--border)'};background:${cli===clienteAtual?'var(--brand)':'var(--input-bg)'};color:${cli===clienteAtual?'#fff':'var(--ink)'};font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer">
          👤 ${escapeHTML(cli)}
        </button>
      `).join('')}
    </div>
  </div>

  <div id="resumoEnviadosMesaBox"></div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" placeholder="Buscar produto no cardápio..." value="${escapeHTML(termoBuscaProduto)}" oninput="filtrarProdutosInput(this.value)">
  </div>

  <div class="atendimento-layout">
    <div class="side-cats" id="categorias">
      ${Object.keys(cardapio).map(c => `
        <div class="side-cat ${c === categoriaAtual ? 'active' : ''}" data-cat="${escapeHTML(c)}" onclick="setCategoria('${escapeHTML(c)}')">
          <span class="cat-ico">${catIcons[c] || '🍴'}</span>
          <span>${escapeHTML(c)}</span>
        </div>
      `).join("")}
    </div>
    
    <div class="products-list" id="produtos"></div>
  </div>`;
 atualizarResumoEnviadosAtendimento();
 renderProdutos();
}

function renderComandas(){
 const ativas = [];
 for(let i=1; i<=TOTAL_MESAS; i++){ if(comandas[i]) ativas.push([String(i), comandas[i]]); }

 document.getElementById("conteudo").innerHTML = `<div class="section-title"><h2>Comandas Ativas</h2><span class="muted">${ativas.length} abertas</span></div>` +
 (ativas.length ? ativas.map(([num, c]) => {
   let itensPorPessoa = {};
   (c.itens || []).forEach(it => {
     let cli = it.cliente || "Cliente 1";
     if(!itensPorPessoa[cli]) itensPorPessoa[cli] = [];
     itensPorPessoa[cli].push(it);
   });

   let htmlPessoas = "";
   for(const cli in itensPorPessoa){
     let subCliente = itensPorPessoa[cli].reduce((s,i) => s + (Number(i.qtd) || 0) * (Number(i.preco) || 0), 0);
     htmlPessoas += `<div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--border)">
       <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--brand)">
         <span>👤 ${escapeHTML(cli)}</span>
         <span>${br(subCliente)}</span>
       </div>
       <div style="font-size:11px;color:var(--muted);margin-top:2px">
         ${itensPorPessoa[cli].map(i => `${i.qtd}x ${escapeHTML(i.nome)}${i.obs ? ` (${escapeHTML(i.obs)})` : ''} ${i.horario ? `[${i.horario}]` : ''}`).join(" • ")}
       </div>
     </div>`;
   }

   const tempoInfo = calcularStatusTempo(c.criadoEm);

   return `<div class="card command ${c.pediuContaAlerta ? 'pediu-conta-ativo' : ''}">
    <div class="row">
      <div>
        <h3>Mesa ${pad(num)} ${c.pediuContaAlerta ? '<span style="font-size:10px;background:#f59e0b;color:#fff;padding:2px 6px;border-radius:6px;margin-left:4px">💰 PEDIU CONTA</span>' : ''}</h3>
        <div class="muted">👤 Garçom: <b>${escapeHTML(c.garcom || "Não informado")}</b></div>
        ${tempoInfo.texto ? `<span class="timer ${tempoInfo.classe}" style="display:inline-block;margin-top:4px">⏱️ ${tempoInfo.texto}</span>` : ""}
      </div>
      <span class="tag">${br(c.total)}</span>
    </div>
    ${htmlPessoas}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <button class="secondary" style="margin:0;font-size:12px;padding:10px" onclick="abrirMesa(${num})">+ Pedido</button>
      <button class="secondary" style="margin:0;font-size:12px;padding:10px" onclick="abrirModalTransferencia(${num})">🔄 Transferir</button>
      <button class="secondary" style="margin:0;font-size:12px;padding:10px;grid-column:span 2;background:rgba(56, 189, 248, 0.1);color:#0284c7;border-color:rgba(56, 189, 248, 0.3)" onclick="unirMesas(${num})">🔗 Juntar / Unir Mesas</button>
      <button class="primary" style="grid-column:span 2;font-size:13px;padding:12px" onclick="dividirContaModal(${num})">💳 Pagar / Fechar Conta</button>
    </div>
  </div>`;
 }).join("") : `<div class="empty">Nenhuma mesa aberta no momento.</div>`);
}

function renderizar(){
  document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));
  const navMap = {
    "mesas": "navMesas", "atendimento": "navMesas", "comandas": "navComandas",
    "cozinha": "navCozinha", "churrasco": "navChurrasco", "bebidas": "navBebidas", "relatorios": "navRelatorios"
  };
  document.getElementById(navMap[telaAtual] || "navMesas")?.classList.add("active");
  
  if(telaAtual === "mesas") renderMesas();
  if(telaAtual === "atendimento") renderAtendimento();
  if(telaAtual === "comandas") renderComandas();
  if(telaAtual === "cozinha") renderCozinha();
  if(telaAtual === "churrasco") renderChurrasco();
  if(telaAtual === "bebidas") renderBebidas();
  if(telaAtual === "relatorios") renderRelatorios();
  atualizarBar();
}

setInterval(() => {
  if(["mesas", "comandas", "cozinha", "churrasco", "bebidas"].includes(telaAtual)){
    renderizar();
  }
}, 60000);

if (modoCliente) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('navInferior').style.display = 'none';
  document.getElementById('adminHeaderBtn').style.display = 'none';
  document.getElementById('logoutHeaderBtn').style.display = 'none';
  document.getElementById('soundToggleBtn').style.display = 'none';
  document.getElementById('pushToggleBtn').style.display = 'none';
  document.getElementById('user-role-label').textContent = mesaUrlCliente ? `Cardápio Digital — Mesa ${pad(mesaUrlCliente)}` : 'Cardápio Digital — Delivery';
  
  iniciarOuvintesFirebase();
  
  if (mesaUrlCliente && mesaUrlCliente >= 1 && mesaUrlCliente <= TOTAL_MESAS) {
    abrirMesa(mesaUrlCliente);
  } else {
    abrirMesa(45); 
    garcomTemp = "Delivery (Cliente)";
  }
} else {
  renderizar();
}
</script>
</body>
</html>
