function atualizarTrocoModal() {
  const input = document.getElementById('inputTrocoModal');
  const lbl = document.getElementById('lblTrocoModal');
  if (!input || !lbl) return;
  const entregue = parseFloat(input.value.replace(',', '.')) || 0;
  const liquido = obterValorLiquidoPagar();
  const troco = Math.max(0, entregue - liquido);
  lbl.textContent = br(troco);
}

function executarPagamentoConfirmado(num, tipo) {
  if (processandoPagamento) return;
  if (!modoPagamentoMisto && !formaPagamentoEscolhidaTemp) {
    showToast("Por favor, selecione a forma de pagamento!", true);
    return;
  }

  const c = comandas[num];
  if (!c) {
    showToast("Esta mesa já foi fechada!", true);
    fecharModal();
    return;
  }

  const liquidoTotal = obterValorLiquidoPagar();
  let parcelasPagamento = [];

  if (modoPagamentoMisto) {
    const m1 = document.getElementById("mistoMetodo1")?.value || "Pix";
    const v1 = parseFloat(document.getElementById("mistoValor1")?.value) || 0;
    const m2 = document.getElementById("mistoMetodo2")?.value || "Dinheiro";
    const v2 = parseFloat(document.getElementById("mistoValor2")?.value) || 0;
    if (v1 <= 0 || v2 <= 0) {
      showToast("Preencha valores válidos para as duas formas.", true);
      return;
    }
    parcelasPagamento.push({ metodo: m1, valor: v1 });
    parcelasPagamento.push({ metodo: m2, valor: v2 });
  } else {
    parcelasPagamento.push({ metodo: formaPagamentoEscolhidaTemp, valor: liquidoTotal });
  }

  processandoPagamento = true;
  const btnConfirmar = document.getElementById('btnConfirmarFinalPagamento');
  if (btnConfirmar) {
    btnConfirmar.disabled = true;
    btnConfirmar.style.opacity = '0.6';
    btnConfirmar.style.pointerEvents = 'none';
    btnConfirmar.textContent = '⏳ Registrando...';
  }

  const agora = new Date();
  const numMesaStr = String(num);
  const batch = db.batch();
  const refMesa = db.collection("comandas").doc(numMesaStr);
  const labelResumoPag = parcelasPagamento.map(p => p.metodo).join(" + ");

  if (tipo === 'parcial') {
    let itensPagosParaHistorico = [];
    let novosItens = [];
    let itensPagosAcumulados = c.itensPagos ? [...c.itensPagos] : [];

    (c.itens || []).forEach((it, idx) => {
      let cli = it.cliente || "Cliente 1";
      let qtdBaixada = baixasPorIndiceTemp[idx] || 0;
      if (qtdBaixada > 0) {
        itensPagosParaHistorico.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco, horario: it.horario, timestampItem: it.timestampItem });
        let jaExiste = itensPagosAcumulados.find(ip => ip.cliente === cli && ip.nome === it.nome);
        if (jaExiste) { jaExiste.qtd += qtdBaixada; }
        else { itensPagosAcumulados.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco, horario: it.horario, timestampItem: it.timestampItem }); }
      }
      let qtdRestante = it.qtd - qtdBaixada;
      if (qtdRestante > 0) {
        novosItens.push({
          loteId: it.loteId || '',
          cliente: cli,
          nome: it.nome,
          qtd: qtdRestante,
          preco: it.preco,
          obs: it.obs || '',
          statusCozinha: it.statusCozinha || '',
          horario: it.horario,
          timestampItem: it.timestampItem
        });
      }
    });

    parcelasPagamento.forEach((parc, pIdx) => {
      const vendaParcial = { 
        mesa: num, 
        total: parc.valor, 
        desconto: pIdx === 0 ? descontoAplicadoTemp : 0,
        pagamento: parc.metodo, 
        garcom: c.garcom || "Sem Garçom", 
        itens: pIdx === 0 ? itensPagosParaHistorico : [], 
        horario: agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
        data: agora.toLocaleDateString('pt-BR'),
        diaSemana: DIAS_SEMANA_PT[agora.getDay()],
        timestamp: agora.getTime() + pIdx
      };
      const refHist = db.collection("historico").doc();
      batch.set(refHist, vendaParcial);
    });
    
    let novoTotal = Math.max(0, Number(c.total) - valorBrutoPendenteTemp);

    // Se quitou tudo na baixa parcial, libera a mesa completamente em vez de deixar ocupada com R$ 0,00
    if (novosItens.length === 0 && novoTotal <= 0) {
      if (mesaAtualPresenca === numMesaStr) {
        if (heartbeatPresencaInterval) {
          clearInterval(heartbeatPresencaInterval);
          heartbeatPresencaInterval = null;
        }
        mesaAtualPresenca = null;
      }
      batch.delete(refMesa);
      batch.commit().then(() => {
        processandoPagamento = false;
        delete comandas[numMesaStr];
        fecharModal();
        showToast(`Mesa ${pad(numMesaStr)} quitada e liberada (${labelResumoPag})!`);
        renderizar();
      }).catch(err => {
        processandoPagamento = false;
        showToast("Erro ao registrar pagamento: " + err.message, true);
      });
    } else {
      batch.update(refMesa, { total: novoTotal, itens: novosItens, itensPagos: itensPagosAcumulados, atualizadoEm: Date.now() });
      batch.commit().then(() => {
        processandoPagamento = false;
        fecharModal(); 
        showToast(`Baixa de ${br(liquidoTotal)} (${labelResumoPag}) realizada!`); 
        renderizar();
      }).catch(err => {
        processandoPagamento = false;
        showToast("Erro ao registrar pagamento: " + err.message, true);
      });
    }

  } else {
    let todos = [...(c.itens || [])];
    if (c.itensPagos) c.itensPagos.forEach(ip => todos.push({ cliente: ip.cliente, nome: ip.nome, qtd: ip.qtd, preco: ip.preco, horario: ip.horario, timestampItem: ip.timestampItem }));

    if (liquidoTotal > 0 && todos.length) {
      parcelasPagamento.forEach((parc, pIdx) => {
        let novaVenda = { 
          mesa: num, 
          total: parc.valor, 
          desconto: pIdx === 0 ? descontoAplicadoTemp : 0,
          pagamento: parc.metodo, 
          garcom: c.garcom || "Sem Garçom", 
          itens: pIdx === 0 ? todos : [], 
          horario: agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
          data: agora.toLocaleDateString('pt-BR'),
          diaSemana: DIAS_SEMANA_PT[agora.getDay()],
          timestamp: agora.getTime() + pIdx
        };
        const refHist = db.collection("historico").doc();
        batch.set(refHist, novaVenda);
      });
    }

    if (mesaAtualPresenca === numMesaStr) {
      if (heartbeatPresencaInterval) {
        clearInterval(heartbeatPresencaInterval);
        heartbeatPresencaInterval = null;
      }
      mesaAtualPresenca = null;
    }
    batch.delete(refMesa);

    batch.commit().then(() => {
      processandoPagamento = false;
      delete comandas[numMesaStr];
      fecharModal();
      showToast(`Mesa ${pad(numMesaStr)} fechada (${labelResumoPag})!`);
      renderizar();
    }).catch(err => {
      processandoPagamento = false;
      showToast("Erro ao fechar mesa: " + err.message, true);
    });
  }
}

function fecharCaixaDiario(){
  const senha = prompt("🔒 Digite a senha do Administrador para ZERAR O CAIXA:");
  if(senha !== SENHA_ADMIN_PADRAO){ showToast("Senha incorreta!", true); return; }

  const totalVendasAtuais = historicoVendas.reduce((acc, v) => acc + Number(v.total || 0), 0);
  const totalDespesasAtuais = despesas.reduce((acc, d) => acc + Number(d.valor || 0), 0);
  const saldoLiquidoAtual = totalVendasAtuais - totalDespesasAtuais;

  const confirmacao = confirm(`⚠️ ATENÇÃO: ZERAR O CAIXA\n\nVendas acumuladas: ${br(totalVendasAtuais)}\nDespesas: ${br(totalDespesasAtuais)}\nSaldo Líquido: ${br(saldoLiquidoAtual)}\n\nDeseja realmente apagar TODO o histórico de vendas, despesas e cancelamentos?`);
  if(!confirmacao) return;

  const p1 = db.collection("historico").get().then(snap => {
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    return batch.commit();
  });

  const p2 = db.collection("despesas").get().then(snap => {
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    return batch.commit();
  });

  const p3 = db.collection("cancelamentos").get().then(snap => {
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    return batch.commit();
  });

  Promise.all([p1, p2, p3]).then(() => {
    showToast("✅ Caixa zerado com sucesso!");
  }).catch(err => {
    showToast("Erro ao zerar caixa: " + err.message, true);
  });
}

function calcularTempoAberta(timestamp){
  if(!timestamp) return { texto: "", classe: "" };
  const diffMs = Date.now() - timestamp;
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return { texto: "Agora", classe: "tempo-verde" };
  let textoTempo = diffMin < 60 ? `${diffMin} min` : `${Math.floor(diffMin/60)}h ${diffMin%60}m`;
  let classeTempo = diffMin < 45 ? "tempo-verde" : (diffMin < 90 ? "tempo-amarelo" : "tempo-vermelho");
  return { texto: `⏱️ ${textoTempo}`, classe: classeTempo };
}

function definirAtalhoOntem() {
  const agora = new Date();
  const ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() - 1, 0, 0, 0);
  const fim = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() - 1, 23, 59, 0);
  filtroDataHoraInicio = formatarDateParaInputDateTimeLocal(ini);
  filtroDataHoraFim = formatarDateParaInputDateTimeLocal(fim);
  modoFiltroRelatorio = 'PERIODO';
  renderRelatorios();
}

function definirAtalhoTudo() {
  modoFiltroRelatorio = 'TODAS';
  renderRelatorios();
}

function abrirDetalhesVendaRelatorio(docId) {
  const venda = historicoVendas.find(v => v._docId === docId);
  if (!venda) return;

  const diaSem = venda.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(venda));
  const itensLista = Array.isArray(venda.itens) ? venda.itens : [];
  const descontoVenda = Number(venda.desconto || 0);

  let itensHTML = itensLista.length > 0 ? itensLista.map(it => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px">
      <div>
        <b>[${escapeHTML(it.cliente || 'Cliente 1')}]</b> ${it.qtd}x ${escapeHTML(it.nome)}
        ${it.horario ? `<div style="font-size:10px;color:var(--muted)">🕒 Pedido às ${it.horario}</div>` : ''}
      </div>
      <b>${br((Number(it.qtd) || 0) * (Number(it.preco) || 0))}</b>
    </div>
  `).join('') : '<div class="empty">Nenhum detalhe de item registrado nesta baixa.</div>';

  document.getElementById("modalTitle").textContent = `🧾 Detalhes — Mesa ${pad(venda.mesa)}`;
  document.getElementById("modalBody").innerHTML = `
    <div style="background:var(--input-bg);padding:12px;border-radius:16px;border:1px solid var(--border);margin-bottom:12px;font-size:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span class="muted">Dia / Data:</span>
        <b>${diaSem ? `${diaSem}, ` : ''}${venda.data || ''} às ${venda.horario || ''}</b>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span class="muted">Garçom:</span>
        <b>${escapeHTML(venda.garcom || 'Não inf.')}</b>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span class="muted">Pagamento:</span>
        <b style="color:#10b981">${escapeHTML(venda.pagamento || 'Não inf.')}</b>
      </div>
      ${descontoVenda > 0 ? `
        <div style="display:flex;justify-content:space-between;color:#d97706">
          <span>Desconto Aplicado:</span>
          <b>− ${br(descontoVenda)}</b>

    <div style="font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Itens Consumidos nesta Venda:</div>
    <div style="max-height:240px;overflow:auto;padding:0 4px">
      ${itensHTML}

    <div class="totalrow">
      <span>Total Pago</span>
      <span style="color:#10b981">${br(venda.total)}</span>
    </div>

    <button class="secondary" onclick="fecharModal()">Fechar</button>
  `;
  document.getElementById("modal").classList.add("show");
}

function exportarRelatorioCSV() {
  const vendasFiltradas = historicoVendas.filter(v => registroDentroDoPeriodo(v));
  const despesasFiltradas = despesas.filter(d => registroDentroDoPeriodo(d));
  const cancelamentosFiltrados = cancelamentos.filter(c => registroDentroDoPeriodo(c));

  let linhas = [];
  linhas.push(["Tipo", "Dia da Semana", "Data", "Horario", "Mesa / Descricao", "Garcom / Motivo", "Forma Pagamento", "Desconto (R$)", "Valor (R$)", "Itens"].join(";"));

  vendasFiltradas.forEach(v => {
    const diaSem = v.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(v));
    const itensStr = (v.itens || []).map(it => `${it.qtd}x ${it.nome} (${it.cliente || 'Cliente 1'})`).join(" | ");
    linhas.push([
      "VENDA",
      diaSem,
      v.data || "",
      v.horario || "",
      `Mesa ${pad(v.mesa)}`,
      v.garcom || "Não inf.",
      v.pagamento || "",
      (Number(v.desconto || 0)).toFixed(2).replace(".", ","),
      (Number(v.total || 0)).toFixed(2).replace(".", ","),
      `"${itensStr.replace(/"/g, '""')}"`
    ].join(";"));
  });

  despesasFiltradas.forEach(d => {
    const diaSem = d.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(d));
    linhas.push([
      "DESPESA",
      diaSem,
      d.data || "",
      d.horario || "",
      `"${(d.desc || "").replace(/"/g, '""')}"`,
      "-",
      "Saída Caixa",
      "0,00",
      (-Math.abs(Number(d.valor || 0))).toFixed(2).replace(".", ","),
      "-"
    ].join(";"));
  });

  cancelamentosFiltrados.forEach(c => {
    const diaSem = c.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(c));
    linhas.push([
      "CANCELAMENTO",
      diaSem,
      c.data || "",
      c.horario || "",
      `Mesa ${pad(c.mesa)}`,
      `"${(c.motivo || "").replace(/"/g, '""')}"`,
      "Cancelado",
      "0,00",
      (Number(c.totalCancelado || 0)).toFixed(2).replace(".", ","),
      "-"
    ].join(";"));
  });

  const csvContent = "\uFEFF" + linhas.join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  const dataHojeArquivo = new Date().toISOString().slice(0, 10);
  link.setAttribute("download", `Relatorio_BB_Churrasco_${dataHojeArquivo}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast("📊 Planilha CSV exportada com sucesso!");
}

      <div style="display:flex;justify-content:space-between;margin-bottom:4px">

      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--border)">
        <span class="muted">Saídas / Despesas:</span>
        <b style="color:#d32f2f">− ${br(totalDespesasPeriodo)}</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px">
        <b>Esperado na Gaveta:</b>
        <b style="color:var(--brand)">${br(saldoEsperadoGaveta)}</b>
      </div>
    </div>

    <div style="margin-bottom:12px">
      <label style="font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px">💵 Quanto você contou fisicamente na gaveta? (R$)</label>
      <input type="number" id="inputContagemGaveta" step="0.01" placeholder="0,00" oninput="calcularDiferencaGaveta(${saldoEsperadoGaveta})" style="width:100%;padding:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:14px;font-size:18px;font-weight:900;text-align:center;outline:none">
    </div>

    <div id="boxResultadoGaveta" style="display:none;padding:12px;border-radius:14px;text-align:center;font-size:13px;font-weight:900;margin-bottom:12px"></div>

    <button class="secondary" onclick="fecharModal()">Fechar Conferência</button>
  `;
  document.getElementById("modal").classList.add("show");
  setTimeout(() => document.getElementById("inputContagemGaveta")?.focus(), 100);
}

function calcularDiferencaGaveta(esperado) {
  const inp = document.getElementById("inputContagemGaveta");
  const box = document.getElementById("boxResultadoGaveta");
  if (!inp || !box) return;
  if (inp.value === "") {
    box.style.display = "none";
    return;
  }
  const contado = parseFloat(inp.value) || 0;
  const diff = Number((contado - esperado).toFixed(2));
  box.style.display = "block";

  if (Math.abs(diff) < 0.01) {
    box.style.background = "rgba(16,185,129,0.15)";
    box.style.color = "#10b981";
    box.innerHTML = "✅ CAIXA BATENDO EXATAMENTE!";
  } else if (diff > 0) {
    box.style.background = "rgba(2,132,199,0.15)";
    box.style.color = "#0284c7";
    box.innerHTML = `🔵 SOBRA DE CAIXA: + ${br(diff)}`;
  } else {
    box.style.background = "rgba(211,47,47,0.15)";
    box.style.color = "#d32f2f";
    box.innerHTML = `🔴 QUEBRA / FALTA NO CAIXA: − ${br(Math.abs(diff))}`;
  }
}

function renderRelatorios(){
  const vendasFiltradas = historicoVendas.filter(v => registroDentroDoPeriodo(v));
  const despesasFiltradas = despesas.filter(d => registroDentroDoPeriodo(d));
  const cancelamentosFiltrados = cancelamentos.filter(c => registroDentroDoPeriodo(c));

  let totalBruto = vendasFiltradas.reduce((a, b) => a + Number(b.total || 0), 0);
  let totalDescontos = vendasFiltradas.reduce((a, b) => a + Number(b.desconto || 0), 0);
  let totalDesp = despesasFiltradas.reduce((a, b) => a + Number(b.valor || 0), 0);
  let totalCancelado = cancelamentosFiltrados.reduce((a, b) => a + Number(b.totalCancelado || 0), 0);
  let liquido = totalBruto - totalDesp;
  let ticketMedio = vendasFiltradas.length ? (totalBruto / vendasFiltradas.length) : 0;

  let porPagamento = { "Pix": 0, "Cartão de Crédito": 0, "Cartão de Débito": 0, "Dinheiro": 0 };
  let rankingGarcons = {};
  let vendasPorHora = {};
  let vendasPorDiaSemana = {};
  let contagemProdutos = {};

  vendasFiltradas.forEach(v => {
    let pg = v.pagamento || "Outros";
    porPagamento[pg] = (porPagamento[pg] || 0) + Number(v.total || 0);
    
    let g = v.garcom || "Não inf.";
    if(!rankingGarcons[g]) rankingGarcons[g] = { total: 0, mesas: 0 };
    rankingGarcons[g].total += Number(v.total || 0);
    rankingGarcons[g].mesas += 1;

    if(v.horario) {
      let horaStr = v.horario.split(':')[0] + "h";
      vendasPorHora[horaStr] = (vendasPorHora[horaStr] || 0) + Number(v.total || 0);
    }

    const diaSem = v.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(v)) || "Outros";
    vendasPorDiaSemana[diaSem] = (vendasPorDiaSemana[diaSem] || 0) + Number(v.total || 0);

    if(v.itens && Array.isArray(v.itens)){
      v.itens.forEach(it => {
        contagemProdutos[it.nome] = (contagemProdutos[it.nome] || 0) + (Number(it.qtd) || 0);
      });
    }
  });

  let garconsHTML = Object.keys(rankingGarcons).sort((a,b) => rankingGarcons[b].total - rankingGarcons[a].total).map((g, idx) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px">
      <div><b>${idx+1}º ${escapeHTML(g)}</b> <small class="muted">(${rankingGarcons[g].mesas} baixas)</small></div>
      <b style="color:var(--brand)">${br(rankingGarcons[g].total)}</b>
    </div>
  `).join('');

  let topProdutosHTML = Object.keys(contagemProdutos).sort((a,b) => contagemProdutos[b] - contagemProdutos[a]).slice(0, 10).map((prod, idx) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
      <div><b>${idx+1}º ${escapeHTML(prod)}</b></div>
      <span class="tag">${contagemProdutos[prod]} un</span>
    </div>
  `).join('');

  let maxVendaHora = Math.max(...Object.values(vendasPorHora), 1);
  let graficoHorasHTML = Object.keys(vendasPorHora).sort().map(h => {
    let val = vendasPorHora[h];
    let perc = Math.round((val / maxVendaHora) * 100);
    return `
      <div style="margin-bottom:6px;font-size:11px">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px">
          <b>${h}</b><span>${br(val)}</span>
        </div>
        <div style="width:100%;background:var(--input-bg);height:8px;border-radius:4px;overflow:hidden">
          <div style="width:${perc}%;background:var(--brand);height:100%;border-radius:4px"></div>
        </div>
      </div>
    `;
  }).join('');

  let diasOrdenados = Object.keys(vendasPorDiaSemana).sort((a, b) => vendasPorDiaSemana[b] - vendasPorDiaSemana[a]);
  let maxVendaDia = Math.max(...Object.values(vendasPorDiaSemana), 1);
  let graficoDiasSemanaHTML = diasOrdenados.map(dia => {
    let val = vendasPorDiaSemana[dia];
    let perc = Math.round((val / maxVendaDia) * 100);
    return `
      <div style="margin-bottom:6px;font-size:11px">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px">
          <b>${escapeHTML(dia)}</b><span>${br(val)}</span>
        </div>
        <div style="width:100%;background:var(--input-bg);height:8px;border-radius:4px;overflow:hidden">
          <div style="width:${perc}%;background:#0284c7;height:100%;border-radius:4px"></div>
        </div>
      </div>

  }).join('');

  let cancelamentosHTML = cancelamentosFiltrados.map(c => {
    const diaSem = c.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(c));
    return `
    <div style="background:rgba(211,47,47,0.06);padding:10px;border-radius:14px;border:1px solid rgba(211,47,47,0.2);font-size:12px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>Mesa ${pad(c.mesa)} — ${escapeHTML(c.garcom)}</b>

  const resumoPeriodoTexto = modoFiltroRelatorio === 'TODAS'
    ? 'Exibindo todo o histórico acumulado no banco'
    : `${formatarDateTimeLocalParaBR(filtroDataHoraInicio)} até ${formatarDateTimeLocalParaBR(filtroDataHoraFim)}`;

  document.getElementById("conteudo").innerHTML = `

     <h2>📊 Relatórios & Gestão</h2>

   </div>

   <div class="card" style="padding:16px;margin-bottom:14px">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
       <h3 style="margin:0;font-size:14px;font-weight:900">💸 Saídas e Despesas (${br(totalDesp)})</h3>
       <button class="secondary" style="width:auto;padding:6px 12px;font-size:11px;margin:0" onclick="adicionarDespesa()">+ Gasto</button>
     </div>
     ${despesasFiltradas.map(d => {
       const diaSem = d.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(d));
       return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
         <div>
           <span>${escapeHTML(d.desc)}</span>
           <small class="muted" style="display:block;font-size:10px">${diaSem ? `${diaSem}, ` : ''}${d.data || ''} às ${d.horario}</small>
         </div>
         <div style="display:flex;align-items:center;gap:6px">
           <b style="color:#d32f2f">- ${br(d.valor)}</b>
           <button onclick="apagarDespesa('${d._docId}')" style="border:0;background:rgba(211,47,47,0.1);color:var(--brand);border-radius:6px;padding:3px 6px;font-size:10px;font-weight:900;cursor:pointer">✕</button>
         </div>
       </div>`;
     }).join('') || '<div class="empty" style="padding:10px">Nenhuma despesa registrada no período.</div>'}
   </div>

   ${cancelamentosHTML ? `
   <div class="card" style="padding:16px;margin-bottom:14px;border-color:rgba(211,47,47,0.3)">
     <h3 style="margin:0 0 10px 0;font-size:14px;font-weight:900;color:#d32f2f">⚠️ Histórico de Cancelamentos</h3>
     ${cancelamentosHTML}
   </div>` : ''}

   <div class="card" style="padding:16px">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
       <h3 style="margin:0;font-size:14px;font-weight:900">📋 Vendas Realizadas (${vendasFiltradas.length})</h3>
       <span style="font-size:10px;color:var(--muted);font-weight:800">Toque para ver detalhes</span>
     </div>
     <div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto">
       ${vendasFiltradas.map(v => {
         const diaSem = v.diaSemana || obterDiaSemanaPorTimestamp(obterTimestampRegistro(v));
         return `
         <div class="report-sale-card" onclick="abrirDetalhesVendaRelatorio('${v._docId}')">
           <div style="display:flex;justify-content:space-between;align-items:center">
             <b>Mesa ${pad(v.mesa)} — ${escapeHTML(v.pagamento)}</b>
             <b style="color:#10b981">${br(v.total)}</b>
           </div>
           <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:wrap;gap:4px">
             <small class="muted">👤 ${escapeHTML(v.garcom || 'Não inf.')} • 🕒 ${v.data || ''} às ${v.horario}</small>
             ${diaSem ? `<span class="weekday-badge">${diaSem}</span>` : ''}
           </div>
         </div>
       `}).join('') || '<div class="empty" style="padding:10px">Nenhuma venda registrada neste período.</div>'}
     </div>
   </div>

   <button class="primary" onclick="fecharCaixaDiario()" style="background:#111827;margin-top:10px">🔒 Fechar Caixa Diário e Zerar Histórico</button>
  `;
}

function renderizar(){
  if (modoCliente) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('navInferior').style.display = 'none';
    document.getElementById('adminHeaderBtn').style.display = 'none';
    document.getElementById('logoutHeaderBtn').style.display = 'none';
    document.getElementById('soundToggleBtn').style.display = 'none';
    document.getElementById('pushToggleBtn').style.display = 'none';
    document.getElementById('btPrinterBtn').style.display = 'none';
    document.getElementById('user-role-label').textContent = `CARDÁPIO DIGITAL — Mesa ${pad(mesaUrlCliente || 1)}`;
    if (!mesaSelecionada) {
      mesaSelecionada = mesaUrlCliente || 1;
      pedidoTemp = { "Cliente 1": {} };
      clienteAtual = "Cliente 1";
      iniciarOuvintesFirebase();
    }
    renderAtendimento();
    return;
  }

  document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));
  const navMap = { "mesas": "navMesas", "comandas": "navComandas", "cozinha": "navCozinha", "churrasco": "navChurrasco", "bebidas": "navBebidas", "relatorios": "navRelatorios" };
  if(navMap[telaAtual]) document.getElementById(navMap[telaAtual])?.classList.add("active");
  
  if(telaAtual === "mesas") renderMesas();
  else if(telaAtual === "comandas") renderComandas();
  else if(telaAtual === "cozinha") renderCozinha();
  else if(telaAtual === "churrasco") renderChurrasco();
  else if(telaAtual === "bebidas") renderBebidas();
  else if(telaAtual === "relatorios") renderRelatorios();
  else if(telaAtual === "atendimento") renderAtendimento();
  atualizarBar();
}

if (modoCliente) {
  renderizar();
}
</script>
</body>
</html>
