<style>
:root{--brand:#b12f29;--brand-dark:#8f241f;--ink:#14281e;--bg:#f8faf9;--card:#ffffff;--border:#e3e8e5}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:110px}.app{max-width:760px;margin:auto;padding:16px 16px 110px}
.header{background:linear-gradient(135deg,#c43831,#92241e);color:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 14px 30px rgba(177,47,41,.2);position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.08)}
.header h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:13px;opacity:.9}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-title h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.muted{color:#6c7a72;font-size:13px}
.bottom{position:fixed;z-index:100;left:50%;bottom:12px;transform:translateX(-50%);width:min(730px,calc(100% - 24px));background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(227,232,229,.8);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:24px;box-shadow:0 10px 30px rgba(20,40,30,.12)}
.bottom button{border:0;background:none;color:#75857c;font-weight:800;font-size:12px;padding:10px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;transition:.2s}.bottom button.active{color:var(--brand);background:#fff1f0}.bottom .ico{font-size:20px;margin-bottom:2px}
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.table{min-height:135px;border-radius:22px;padding:12px 8px;border:2px solid #52b761;background:#f1fbf3;color:#184a27;box-shadow:0 6px 16px rgba(40,110,60,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}.table:active{transform:scale(.96)}.table.busy{border-color:#e05650;background:#fff2f1;color:#8f241f;box-shadow:0 6px 16px rgba(177,47,41,.06)}.table .num{font-size:18px;font-weight:900}.table .status{font-size:10px;font-weight:900;margin-top:2px;letter-spacing:.3px}.table .total{font-size:12px;font-weight:900;margin-top:4px}.table .garcom-tag{font-size:9px;background:rgba(0,0,0,.06);padding:2px 6px;border-radius:6px;margin-top:4px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 24px rgba(20,40,30,.05);padding:18px;margin-bottom:14px}.topbar{display:flex;gap:12px;align-items:center}.back{border:0;background:#edf2ef;border-radius:14px;width:40px;height:40px;font-weight:900;font-size:16px;display:grid;place-items:center;cursor:pointer}.mesa-head{flex:1}.mesa-head h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.mesa-head p{margin:2px 0 0;font-size:12px;color:#6c7a72}
.people{margin-top:14px;padding:14px 16px;border-radius:18px;background:#f4f7f5;display:flex;align-items:center;justify-content:space-between}.people input{width:150px;border:1px solid #d4ddd8;border-radius:12px;padding:10px;text-align:center;font-weight:900;background:#fff;font-size:13px;outline:none}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 2px 12px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--border);background:#fff;color:#526159;border-radius:999px;padding:10px 16px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.02);cursor:pointer}.cat.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(177,47,41,.3)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;border-radius:20px;background:#fff;border:1px solid var(--border);box-shadow:0 6px 18px rgba(20,30,20,.04)}
.prod-img{height:85px;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4f7f5,#e8efe9)}
.prod-body{padding:12px}.prod-name{font-size:14px;font-weight:900;line-height:1.25;min-height:35px}.prod-desc{font-size:10px;color:#6c7a72;margin-top:2px;font-weight:600;line-height:1.2}.price{font-size:13px;font-weight:900;color:var(--brand);margin:6px 0 10px}.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty button{width:36px;height:36px;border:0;border-radius:12px;background:#edf2ef;font-weight:900;font-size:18px;cursor:pointer}.qty button.plus{background:var(--brand);color:#fff}.qty span{font-weight:900;min-width:22px;text-align:center;font-size:15px}.selected{outline:2px solid #52b761;outline-offset:-2px}
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:82px;width:min(720px,calc(100% - 24px));background:#14281e;color:#fff;border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(20,40,30,.3)}.cartbar button{border:0;background:#fff;color:#14281e;border-radius:14px;padding:10px 16px;font-weight:900;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.5);backdrop-filter:blur(4px);z-index:200;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.close{border:0;background:#edf2ef;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f0f4f1}.line small{color:#6c7a72}.totalrow{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:16px 0;border-top:2px dashed #edf2ef;margin-top:6px}.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:16px;padding:15px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(177,47,41,.25);cursor:pointer}.secondary{width:100%;border:0;background:#edf2ef;color:#183625;border-radius:16px;padding:14px;font-weight:900;margin-top:8px;cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:#75857c;font-weight:700}.command{padding:18px;margin-bottom:12px}.command .row{display:flex;justify-content:space-between;gap:10px}.command h3{margin:0;font-size:17px;font-weight:900;color:var(--ink)}.tag{font-size:11px;font-weight:900;border-radius:999px;padding:5px 10px;background:#fff1f0;color:var(--brand)}
</style>

<div id="login-screen" style="position:fixed;inset:0;background:linear-gradient(135deg,#7f1d1d,#1c1917,#000);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:24px;padding:30px;width:100%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.4)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:8px">🔥</div>
      <h2 style="font-size:22px;font-weight:900;margin:0;color:#14281e">B.B CHURRASCO</h2>
      <p style="font-size:12px;color:#6c7a72;margin:4px 0 0">Faça login para acessar o sistema</p>
    </div>
    <form onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="font-size:11px;font-weight:900;text-transform:uppercase;color:#6c7a72;display:block;margin-bottom:4px">E-mail</label>
        <input type="email" id="login-email" required style="width:100%;padding:12px;border:1px solid #d4ddd8;border-radius:14px;font-size:14px;font-weight:700;outline:none" placeholder="ex: garcom@bbchurrasco.com">
      </div>
      <div>
        <label style="font-size:11px;font-weight:900;text-transform:uppercase;color:#6c7a72;display:block;margin-bottom:4px">Senha</label>
        <input type="password" id="login-password" required style="width:100%;padding:12px;border:1px solid #d4ddd8;border-radius:14px;font-size:14px;font-weight:700;outline:none" placeholder="••••••••">
      </div>
      <div id="login-error" style="color:#b12f29;font-size:12px;font-weight:800;text-align:center;display:none">E-mail ou senha incorretos.</div>
      <button type="submit" style="background:var(--brand);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:14px;cursor:pointer;margin-top:6px">Entrar no Sistema</button>
    </form>
  </div>
</div>

<div class="app">
<header class="header">
  <h1>B.B CHURRASCO</h1>
  <p id="user-role-label">B.B GARÇOM — Sistema de Atendimento</p>
</header>
<div id="conteudo"></div>

<div id="cartBar" class="cartbar" style="display:none">
  <div><strong id="cartCount">0 itens</strong><br><span id="cartTotal">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navComandas" onclick="mudarTela('comandas')"><span class="ico">📋</span>Comandas</button>
 <button id="navRelatorios" onclick="mudarTela('relatorios')"><span class="ico">📊</span>Relatórios</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
  authDomain: "bbchurrasco-app.firebaseapp.com",
  projectId: "bbchurrasco-app",

if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db = firebase.firestore();
// Ativa persistência offline para evitar perda de dados em quedas de sinal
db.enablePersistence().catch((err) => { console.log("Modo offline não suportado ou em uso simultâneo."); });

// Ícones vetorizados embutidos
const iconeGenerico = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="12" y1="7" x2="12.01" y2="7"/></svg>`;
const iconeCarne = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5.5a3 3 0 1 0 4 4L12 17l-5.5-5.5a3 3 0 1 0 4-4L12 8l3.5-2.5z"/></svg>`;
const iconeBebida = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-2-.5-2-1.5s-1-1.5-2-1.5-2 .5-2 1.5"/><path d="M5 7h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg>`;
const iconePetisco = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l2-10h8l2 10"/><path d="M10 15v4"/><path d="M14 15v4"/></svg>`;

const cardapio={
"CHURRASCOS":[
["Frango", 8, iconeCarne],
["Porco", 8, iconeCarne],
["Linguiça", 8, iconeCarne],
["Coração de frango", 8, iconeCarne],

"BEBIDAS":[

["Meio litro amarela", 16, iconeBebida],
["Meio litro prata", 15, iconeBebida],
["Balde Skol", 50, iconeBebida],

["Energético Red bull", 10, iconeBebida, "Lata"],
["Kit gin", 80, iconeBebida, "Gin rock’s / energético Baly / Gelo"],
["Stella gold", 11, iconeBebida],
["Ice cabaré", 9, iconeBebida]],
"SUCOS":[

["Suco Manga 400ml", 7, iconeBebida],
["Suco Goiaba 400ml", 7, iconeBebida]],
"REFRIGERANTES":[
["Coca-Cola 1L", 8, iconeBebida],
["Guaraná 1L", 7, iconeBebida],
["Pepsi 1L", 7, iconeBebida],
["Coca-Cola lata", 5, iconeBebida],
["Fanta lata", 5, iconeBebida],
["Sprite lata", 6, iconeBebida],
["Água", 3, iconeBebida],
["Água com gás", 4, iconeBebida]],
"PETISCOS":[
["Batata frita", 15, iconePetisco],
["Calabresa acebolada", 15, iconePetisco],
["Camarão (porção)", 25, iconePetisco]],
"GUARNIÇÕES":[
["Baião caseiro grande", 8, iconeGenerico],
["Baião caseiro pequeno", 4, iconeGenerico],
["Baião cremoso grande", 10, iconeGenerico],
["Baião cremoso pequeno", 5, iconeGenerico],
["Feijão verde", 25, iconeGenerico, "Combo"],
["Panelada", 18, iconeGenerico, "Arroz / farofa de cuscuz"]],
"DIVERSOS":[
["Cigarro", 7, iconeGenerico, "Carteira"],
["Partilha halls", 3, iconeGenerico]]
};

let comandas = {};
let historicoVendas = [];
let despesas = [];
let cancelamentos = [];
let telaAtual = "mesas", mesaSelecionada = null, pedidoTemp = {}, pessoasTemp = 1, garcomTemp = "Hebster", categoriaAtual = "CHURRASCOS";
let usuarioLogadoEmail = "";

const br = v => (v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");

function iniciarOuvintesFirebase() {
  db.collection("comandas").onSnapshot(snapshot => {
    comandas = {};
    snapshot.forEach(doc => { 
      let id = doc.id;
      let num = parseInt(id);
      if(isNaN(num) || num < 1 || num > 30 || String(num) !== String(id).trim()){
        db.collection("comandas").doc(id).delete().catch(err => console.log("Erro ao limpar lixo:", err));
        return;
      }
      comandas[id] = doc.data(); 
    });
    if(telaAtual === "mesas" || telaAtual === "comandas") renderizar();
  }, err => console.error("Erro ouvindo comandas:", err));

  db.collection("historico").onSnapshot(snapshot => {
    historicoVendas = [];
    snapshot.forEach(doc => { historicoVendas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error("Erro ouvindo historico:", err));

  db.collection("despesas").onSnapshot(snapshot => {
    despesas = [];
    snapshot.forEach(doc => { despesas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error("Erro ouvindo despesas:", err));

  db.collection("cancelamentos").onSnapshot(snapshot => {
    cancelamentos = [];
    snapshot.forEach(doc => { cancelamentos.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error("Erro ouvindo cancelamentos:", err));
}

function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((userCredential)=>{
      usuarioLogadoEmail = userCredential.user.email;
      concluirLogin(usuarioLogadoEmail);
    })
    .catch((error)=>{
      document.getElementById('login-error').style.display = 'block';
    });
}

function concluirLogin(email){
  document.getElementById('login-screen').style.display = 'none';
  const isAdmin = email.toLowerCase().includes('admin');
  
  if(!isAdmin){
    document.getElementById('navRelatorios').style.display = 'none';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(2,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B GARÇOM — Atendimento';
    if(telaAtual === 'relatorios') telaAtual = 'mesas';
  } else {
    document.getElementById('navRelatorios').style.display = 'flex';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(3,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B ADMIN — Gestão Completa';
  }
  iniciarOuvintesFirebase();
  renderizar();
}

function mudarTela(t, num=null){
  if(t === 'relatorios' && usuarioLogadoEmail && !usuarioLogadoEmail.toLowerCase().includes('admin')) return;
  telaAtual = t; if(num !== null) mesaSelecionada = Number(num); renderizar(); scrollTo(0,0);
}

function abrirMesa(num){
  mesaSelecionada = Number(num); pedidoTemp = {}; pessoasTemp = 1; garcomTemp = "Hebster";
  if(comandas[num]){
    pessoasTemp = comandas[num].pessoas || 1;
    garcomTemp = comandas[num].garcom || "Hebster";
    (comandas[num].itens || []).forEach(i => pedidoTemp[i.nome] = i.qtd);
  }
  mudarTela("atendimento", num);
}

function atualizarPessoas(v){ 
  pessoasTemp = Math.max(1, parseInt(v) || 1); 
  salvarRascunhoAutomatico();
}
function atualizarGarcom(v){ 
  garcomTemp = v.trim() || "Hebster"; 
  salvarRascunhoAutomatico();
}

// SALVAMENTO AUTOMÁTICO EM TEMPO REAL (Evita perda de dados por travamento ou recarga)
function salvarRascunhoAutomatico(){
  if(telaAtual !== "atendimento" || !mesaSelecionada) return;
  const itens = itensTemp();
  const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
  
  // Se a mesa estiver vazia e não tiver itens, não cria comanda vazia
  if(!itens.length && !comandas[mesaSelecionada]) return;

  const dadosMesa = { 
    pessoas: pessoasTemp, 
    garcom: garcomTemp, 
    itens: itens.length ? itens : (comandas[mesaSelecionada]?.itens || []), 
    total: itens.length ? total : (comandas[mesaSelecionada]?.total || 0), 
    atualizadoEm: Date.now() 
  };

  db.collection("comandas").doc(String(mesaSelecionada)).set(dadosMesa, { merge: true })
    .catch(err => console.log("Aviso de sincronização automática:", err));
}

function alterarQtd(nome, delta){ 
  pedidoTemp[nome] = (pedidoTemp[nome] || 0) + delta; 
  if(pedidoTemp[nome] < 0) pedidoTemp[nome] = 0; 
  renderProdutos(); 
  atualizarBar(); 
  salvarRascunhoAutomatico(); // Salva instantaneamente a cada clique!
}

function produtosFlat(){ let a = []; for(const cat in cardapio) cardapio[cat].forEach(p => a.push({nome:p[0], preco:p[1], svg:p[2], desc:p[3], cat})); return a; }
function totalTemp(){ return produtosFlat().reduce((s,p) => s + (pedidoTemp[p.nome] || 0) * p.preco, 0); }
function itensTemp(){ return produtosFlat().filter(p => (pedidoTemp[p.nome] || 0) > 0).map(p => ({nome:p.nome, qtd:pedidoTemp[p.nome], preco:p.preco})); }

function atualizarBar(){
  const items = Object.values(pedidoTemp).reduce((a,b) => a+b, 0), total = totalTemp();
  const bar = document.getElementById("cartBar");
  if(telaAtual === "atendimento" && items){
    bar.style.display = "flex";
    document.getElementById("cartCount").textContent = `${items} ${items === 1 ? "item" : "itens"}`;
    document.getElementById("cartTotal").textContent = br(total);
  } else bar.style.display = "none";
}
function setCategoria(cat){ categoriaAtual = cat; renderProdutos(); }

function renderProdutos(){
 const el = document.getElementById("produtos"); if(!el) return;
 el.innerHTML = cardapio[categoriaAtual].map(p => {
   const [nome, preco, svg, desc] = p, q = pedidoTemp[nome] || 0;
   return `<div class="product ${q ? "selected" : ""}">
   <div class="prod-img">${svg}</div><div class="prod-body"><div class="prod-name">${nome}</div>${desc ? `<div class="prod-desc">${desc}</div>` : ''}<div class="price">${br(preco)}</div>
   <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`;
 }).join("");
 document.querySelectorAll(".cat").forEach(x => x.classList.toggle("active", x.dataset.cat === categoriaAtual));
 atualizarBar();
}

function renderAtendimento(){
 const total = totalTemp();
 document.getElementById("conteudo").innerHTML = `<div class="section-title"><div class="topbar" style="width:100%"><button class="back" onclick="mudarTela('mesas')">←</button><div class="mesa-head"><h2>Mesa ${pad(mesaSelecionada)}</h2><p>Atendimento seguro (Salvo Auto)</p></div><span class="tag">${br(total)}</span></div></div>
 <div class="card people"><span><b>👥 Pessoas na mesa</b><br><small class="muted">Informe para divisão</small></span><input id="pessoas" type="number" min="1" value="${pessoasTemp}" onchange="atualizarPessoas(this.value)"></div>
 <div class="card people"><span><b>👤 Garçom Responsável</b><br><small class="muted">Nome de quem atende</small></span>
   <input id="garcomInput" type="text" value="${garcomTemp}" placeholder="Ex: João, Maria..." oninput="atualizarGarcom(this.value)">
 </div>
 <div class="section-title"><h2>Cardápio</h2><span class="muted">${itensTemp().reduce((s,i) => s+i.qtd,0)} itens</span></div>
 <div class="cats">${Object.keys(cardapio).map(c => `<button class="cat ${c === categoriaAtual ? "active" : ""}" data-cat="${c}" onclick="setCategoria('${c}')">${c==="CHURRASCOS"?"🔥":c==="CARANGUEJO"?"🦀":c==="BEBIDAS"?"🍺":c==="SUCOS"?"🧃":c==="REFRIGERANTES"?"🥤":c==="PETISCOS"?"🍟":c==="GUARNIÇÕES"?"🍚":"🛒"} ${c}</button>`).join("")}</div>
 <div id="produtos" class="products"></div>`;
 renderProdutos();
}

function salvarComanda(){
 const itens = itensTemp(); if(!itens.length){ alert("Adicione pelo menos um produto."); return; }
 const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
 const dadosMesa = { pessoas: pessoasTemp, garcom: garcomTemp, itens, total, atualizadoEm: Date.now() };

 db.collection("comandas").doc(String(mesaSelecionada)).set(dadosMesa)
   .then(() => {
     fecharModal();
     alert(`Mesa ${pad(mesaSelecionada)} salva com sucesso!`);
     mudarTela("mesas");
   })
   .catch(err => { alert("Erro ao salvar: " + err.message); });
}

function abrirCarrinho(){
 const itens = itensTemp();
 document.getElementById("modalTitle").textContent = `Mesa ${pad(mesaSelecionada)} — Pedido`;
 document.getElementById("modalBody").innerHTML = `${itens.map(i => `<div class="line"><div><b>${i.qtd}x ${i.nome}</b><br><small>${br(i.preco)} cada</small></div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}<div class="totalrow"><span>Total</span><span>${br(totalTemp())}</span></div><button class="primary" onclick="salvarComanda()">💾 Confirmar e Fechar Resumo</button><button class="secondary" onclick="fecharModal()">Continuar adicionando</button>`;
 document.getElementById("modal").classList.add("show");
}

function fecharModal(){ document.getElementById("modal").classList.remove("show"); }

function dividirContaModal(num){
 const c = comandas[num]; if(!c) return;

 document.getElementById("modalTitle").textContent = `Baixa e Pagamento - Mesa ${pad(num)}`;
 document.getElementById("modalBody").innerHTML = `
  <div style="text-align:center;margin-bottom:14px">
    <div style="font-size:13px;color:#6c7a72">Total Restante da Comanda</div>
    <div style="font-size:24px;font-weight:900;color:var(--brand)">${br(c.total)}</div>
  </div>

  <div class="card" style="background:#f4f7f5;padding:14px;margin-bottom:14px">
    <div style="font-weight:900;margin-bottom:4px">🎯 Quantidades a Baixar / Pagar:</div>
    <div style="font-size:12px;color:#6c7a72;margin-bottom:12px">Ajuste quantos itens deseja abater agora. O restante continua na mesa.</div>
    
    <div style="max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px">
      ${(c.itens || []).map((i, idx) => `
        <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 12px;border-radius:14px;border:1px solid #d4ddd8">
          <div style="flex:1;padding-right:8px">
            <div style="font-weight:900;font-size:14px">${i.nome}</div>
            <div style="font-size:11px;color:#6c7a72">Na mesa: <b>${i.qtd}x</b> (${br(i.preco)} un)</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button onclick="mudarQtdPagamento(${idx}, -1, ${i.qtd})" style="width:34px;height:34px;border:0;border-radius:10px;background:#edf2ef;font-weight:900;font-size:18px;cursor:pointer">−</button>
            <span id="qtd-pagar-${idx}" data-max="${i.qtd}" data-preco="${i.preco}" data-nome="${i.nome}" style="font-weight:900;width:26px;text-align:center;font-size:15px">0</span>
            <button onclick="mudarQtdPagamento(${idx}, 1, ${i.qtd})" style="width:34px;height:34px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:900;font-size:18px;cursor:pointer">+</button>
          </div>
        </div>
      `).join("")}
    </div>
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #d4ddd8">
      <span style="font-weight:700">Total Selecionado:</span>
      <b id="lblTotalSelecionado" style="color:var(--brand);font-size:18px">R$ 0,00</b>
    </div>
    <button class="primary" style="margin-top:12px;background:#2e7d32" onclick="pagarItensSelecionados(${num})">✅ Confirmar Baixa / Pagar Selecionados</button>
  </div>

  <div class="card" style="background:#fff9f8;border-color:#f8d7d5;padding:14px;margin-bottom:14px">
    <div style="font-weight:900;margin-bottom:8px">💵 Digitar Valor Específico em R$:</div>
    <div style="display:flex;gap:8px">
      <input id="valorPersonalizado" type="number" step="0.01" placeholder="Ex: 63.00" style="flex:1;border:1px solid #d4ddd8;border-radius:10px;padding:10px;text-align:center;font-weight:900;background:#fff;font-size:16px">
      <button class="primary" style="width:auto;padding:10px 16px;background:#b12f29;margin:0" onclick="pagarValorLivre(${num})">Abater</button>
    </div>
  </div>

  <button class="primary" onclick="fecharMesaDireto(${num})" style="margin-bottom:8px">✅ Fechar Mesa Completa (${br(c.total)})</button>
  <button class="secondary" style="background:#feeceb;color:#a92d25;border:0" onclick="cancelarComandaPrompt(${num})">🗑️ Cancelar/Excluir Comanda Inteira</button>
  <button class="secondary" onclick="fecharModal()" style="margin-top:8px">Voltar</button>`;
 document.getElementById("modal").classList.add("show");
}

function mudarQtdPagamento(idx, delta, maxQtd){
  let span = document.getElementById(`qtd-pagar-${idx}`);
  if(!span) return;
  let atual = parseInt(span.textContent) || 0;
  let novo = atual + delta;
  if(novo < 0) novo = 0;
  if(novo > maxQtd) novo = maxQtd;
  span.textContent = novo;
  calcularValorSelecionadoComControle();
}

function calcularValorSelecionadoComControle(){
  let totalSel = 0;
  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtd = parseInt(span.textContent) || 0;
    let preco = parseFloat(span.dataset.preco) || 0;
    totalSel += qtd * preco;
  });
  document.getElementById('lblTotalSelecionado').textContent = br(totalSel);
}

function pagarItensSelecionados(num){
  const c = comandas[num]; if(!c) return;
  
  let valTotalSel = 0;
  let baixas = {};
  let temSelecao = false;

  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtdPagar = parseInt(span.textContent) || 0;
    if(qtdPagar > 0){
      temSelecao = true;
      let nome = span.dataset.nome;
      let preco = parseFloat(span.dataset.preco);
      valTotalSel += qtdPagar * preco;
      baixas[nome] = qtdPagar;
    }
  });

  if(!temSelecao){ alert("Selecione pelo menos a quantidade de um item nos botões + para pagar."); return; }

  if(confirm(`Confirmar o pagamento dos itens selecionados totalizando ${br(valTotalSel)}?`)){
    let itensPagosParaHistorico = [];
    let novosItens = [];

    c.itens.forEach(it => {
      let qtdBaixada = baixas[it.nome] || 0;
      if(qtdBaixada > 0){
        itensPagosParaHistorico.push({ nome: it.nome, qtd: qtdBaixada, preco: it.preco });
      }
      let qtdRestante = it.qtd - qtdBaixada;
      if(qtdRestante > 0){
        novosItens.push({ nome: it.nome, qtd: qtdRestante, preco: it.preco });
      }
    });

    const vendaParcial = { mesa: num, total: valTotalSel, garcom: c.garcom || "Geral", itens: itensPagosParaHistorico, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
    let novoTotal = c.total - valTotalSel;

    db.collection("historico").add(vendaParcial).then(() => {
      if(novoTotal <= 0.5 || !novosItens.length){
        db.collection("comandas").doc(String(num)).delete().then(() => {
          fecharModal(); alert("Todos os itens foram pagos! Comanda fechada."); renderizar();
        }).catch(err => alert("Erro ao fechar comanda: " + err.message));
      } else {
        db.collection("comandas").doc(String(num)).update({ total: novoTotal, itens: novosItens }).then(() => {
          fecharModal(); alert(`Baixa realizada com sucesso! Restam ${br(novoTotal)} na mesa.`); renderizar();
        }).catch(err => alert("Erro ao atualizar comanda: " + err.message));
      }
    }).catch(err => alert("Erro ao salvar histórico: " + err.message));
  }
}

function fecharMesa(num){ dividirContaModal(num); }

function pagarValorLivre(num){
 const c = comandas[num]; if(!c) return;
 let valInput = parseFloat(document.getElementById("valorPersonalizado").value.toString().replace(",","."));
 if(isNaN(valInput) || valInput <= 0){ alert("Digite um valor válido para pagamento."); return; }
 if(valInput > c.total + 0.5){ alert("O valor informado é maior que o total restante da mesa."); return; }

 if(confirm(`Confirmar o abatimento de ${br(valInput)} (pagamento parcial)?`)){
   const vendaParcial = { mesa: num, total: valInput, garcom: c.garcom || "Geral", itens: [{nome:"Pagamento Parcial / Personalizado", qtd:1, preco:valInput}], horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
   
   db.collection("historico").add(vendaParcial).then(() => {
     let novoTotal = c.total - valInput;
     if(novoTotal <= 0.5){
       db.collection("comandas").doc(String(num)).delete().then(() => {
         fecharModal(); alert("Comanda totalmente quitada e fechada!"); renderizar();
       }).catch(err => alert("Erro ao apagar comanda: " + err.message));
     } else {
       db.collection("comandas").doc(String(num)).update({ total: novoTotal }).then(() => {
         fecharModal(); alert(`Pagamento de ${br(valInput)} registrado! Restam ${br(novoTotal)} na mesa.`); renderizar();
       }).catch(err => alert("Erro ao atualizar comanda: " + err.message));
     }
   }).catch(err => alert("Erro ao salvar histórico parcial: " + err.message));
 }
}

function fecharMesaDireto(num){
 const c = comandas[num]; if(!c) return;
 if(confirm(`Deseja realmente fechar a Mesa ${pad(num)} e enviar ${br(c.total)} para o Relatório do Dia?`)){
   const vendaCompleta = { mesa: num, total: c.total, garcom: c.garcom || "Geral", itens: c.itens || [], horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
   
   db.collection("historico").add(vendaCompleta).then(() => {
     db.collection("comandas").doc(String(num)).delete().then(() => {
       fecharModal();
       alert(`Mesa ${pad(num)} fechada com sucesso!`);
       renderizar();
     }).catch(err => alert("Erro ao apagar comanda do Firestore: " + err.message));
   }).catch(err => alert("Erro ao salvar histórico de vendas: " + err.message));
 }
}

function cancelarComandaPrompt(num){
 const c = comandas[num]; if(!c) return;
 let motivo = prompt(`ATENÇÃO: Deseja cancelar/excluir a Mesa ${pad(num)} (${br(c.total)})?\n\nInforme o motivo do cancelamento para auditoria do Admin:`);
 if(motivo === null) return;
 if(!motivo.trim()){ alert("É obrigatório informar o motivo para cancelar a comanda."); return; }

 const registroCancelamento = {
   mesa: num,
   totalPerdido: c.total,
   garcomResponsavel: c.garcom || "Geral",
   motivo: motivo.trim(),
   usuarioCancelou: usuarioLogadoEmail || "Desconhecido",
   horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
   dataTimestamp: Date.now()
 };

 db.collection("cancelamentos").add(registroCancelamento).then(() => {
   db.collection("comandas").doc(String(num)).delete().then(() => {
     fecharModal();
     alert(`Mesa ${pad(num)} cancelada com sucesso. O Admin foi alertado.`);
     renderizar();
   }).catch(err => alert("Erro ao apagar comanda: " + err.message));
 }).catch(err => alert("Erro ao registrar cancelamento: " + err.message));
}

function adicionarDespesa(){
  let desc = prompt("Nome da despesa (ex: Gelo, Carvão, Carne):"); if(!desc) return;
  let valor = prompt("Valor da despesa em R$ (ex: 45.00):"); if(!valor) return;
  valor = parseFloat(valor.replace(",","."));
  if(isNaN(valor) || valor <= 0){ alert("Valor inválido."); return; }
  let novaDespesa = { desc, valor, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
  
  db.collection("despesas").add(novaDespesa).then(() => { 
    renderRelatorios(); 
  }).catch(err => alert("Erro ao salvar despesa: " + err.message));
}

function limparRelatorios(){
  if(confirm("Deseja zerar todo o histórico de vendas, despesas e alertas de cancelamento do dia?")){
    const batch = db.batch();
    db.collection("historico").get().then(snapshot => {
      snapshot.docs.forEach(doc => batch.delete(doc.ref));
      db.collection("despesas").get().then(snapshot2 => {
        snapshot2.docs.forEach(doc => batch.delete(doc.ref));
        db.collection("cancelamentos").get().then(snapshot3 => {
          snapshot3.docs.forEach(doc => batch.delete(doc.ref));
          batch.commit().then(() => { 
            alert("Relatórios e registros zerados com sucesso!");
            renderRelatorios(); 
          }).catch(err => alert("Erro ao zerar: " + err.message));
        });
      });
    }).catch(err => alert("Erro ao buscar dados para zerar: " + err.message));
  }
}

function renderMesas(){
 let abertas = Object.keys(comandas).filter(k => {
   let numMesa = parseInt(k);
   return !isNaN(numMesa) && numMesa >= 1 && numMesa <= 30 && comandas[k]?.itens?.length;
 }).length;

 document.getElementById("conteudo").innerHTML = `<div class="section-title"><div><h2>Mesas</h2><span class="muted">${abertas} aberta${abertas === 1 ? "" : "s"} no salão</span></div><span class="tag">30 mesas</span></div>
 <div class="tables">${Array.from({length:30},(_,i) => { 
   let n = i+1, c = comandas[n], busy = c?.itens?.length; 
   return `<div class="table ${busy ? "busy" : ""}" onclick="abrirMesa(${n})"><div class="num">Mesa ${pad(n)}</div><div class="status">${busy ? "OCUPADA" : "LIVRE"}</div>${busy ? `<div class="total">${br(c.total)}</div><div class="garcom-tag">👤 ${c.garcom || 'Hebster'}</div>` : ""}</div>`; 
 }).join("")}</div>`;
}

function renderComandas(){
 let abertas = Object.entries(comandas).filter(([m,c]) => {
   let numMesa = parseInt(m);
   return !isNaN(numMesa) && String(numMesa) === String(m).trim() && numMesa >= 1 && numMesa <= 30 && c?.itens?.length;
 });
 document.getElementById("conteudo").innerHTML = `<div class="section-title"><div><h2>Comandas Abertas</h2><span class="muted">${abertas.length} mesa${abertas.length === 1 ? "" : "s"} ativa${abertas.length === 1 ? "" : "s"}</span></div></div>
 ${abertas.length ? abertas.map(([m,c]) => `<div class="card command"><div class="row"><h3>Mesa ${pad(m)}</h3><strong style="color:var(--brand);font-size:18px">${br(c.total)}</strong></div><p class="muted" style="font-size:12px;margin:4px 0 12px">👤 Atendente: <b>${c.garcom || 'Hebster'}</b> • 👥 ${c.pessoas||1} pes. • Média: ${br(c.total/(c.pessoas||1))}</p>${(c.itens||[]).map(i => `<div class="row" style="font-size:13px;margin:5px 0"><span>${i.qtd}x ${i.nome}</span><b>${br(i.qtd*i.preco)}</b></div>`).join("")}<div style="display:flex;gap:8px;margin-top:14px"><button class="secondary" style="margin:0" onclick="abrirMesa(${m})">✏️ Editar / Adicionar</button><button class="primary" style="background:#b12f29" onclick="fecharMesa(${m})">💰 Dividir / Pagar</button></div></div>`).join("") : `<div class="card empty">📋<br><b>Nenhuma comanda aberta</b><br>As mesas em atendimento aparecerão aqui.</div>`}`;
}

function renderRelatorios(){
 let totalFaturamento = historicoVendas.reduce((s,v) => s + v.total, 0);
 let totalDespesas = despesas.reduce((s,d) => s + d.valor, 0);
 let lucroLiquido = totalFaturamento - totalDespesas;
 let itensContador = {};
 historicoVendas.forEach(v => (v.itens || []).forEach(i => {
  if(!itensContador[i.nome]) itensContador[i.nome] = {qtd:0, preco:i.preco};
  itensContador[i.nome].qtd += i.qtd;
 }));
 let listaItens = Object.entries(itensContador);

 document.getElementById("conteudo").innerHTML = `
  <div class="section-title"><div><h2>Relatório Financeiro</h2><span class="muted">Resumo do Dia</span></div><button onclick="limparRelatorios()" style="border:0;background:#feeceb;color:#a92d25;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer">🗑️ Resetar Dia</button></div>
  <div class="card" style="background:linear-gradient(135deg,#14281e,#1f3d2e);color:#fff">
    <div style="font-size:13px;opacity:.85">Lucro Líquido (Faturamento - Gastos)</div>
    <div style="font-size:30px;font-weight:900;margin-top:4px">${br(lucroLiquido)}</div>
    <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px">
      <div>📈 Faturamento: <br><b style="font-size:14px">${br(totalFaturamento)}</b></div>
      <div>📉 Total Gastos: <br><b style="font-size:14px">${br(totalDespesas)}</b></div>
    </div>
  </div>

  ${cancelamentos.length ? `
    <div style="margin-bottom:14px;background:#fff1f0;border:2px solid #b12f29;border-radius:20px;padding:16px">
      <div style="display:flex;align-items:center;gap:8px;color:#b12f29;font-weight:900;font-size:15px;margin-bottom:10px">
        <span>⚠️</span> ALERTA: Comandas Canceladas (${cancelamentos.length})
      </div>
      ${cancelamentos.map(can => `
        <div style="background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;border:1px solid #f8d7d5">
          <div><b>Mesa ${pad(can.mesa)}</b> — Valor perdido: <b style="color:#b12f29">${br(can.totalPerdido)}</b></div>
          <div style="color:#6c7a72;margin:2px 0">Motivo: <b>${can.motivo}</b></div>
          <div style="font-size:11px;color:#999">Atendente: ${can.garcomResponsavel} | Cancelado por: ${can.usuarioCancelou} às ${can.horario}</div>
        </div>
      `).join("")}
    </div>
  ` : ''}

  <div style="margin-bottom:14px"><button class="primary" onclick="adicionarDespesa()">➕ Registrar Gasto / Despesa</button></div>
  <div class="section-title"><h2>Gastos Registrados</h2></div>
  <div class="card">${despesas.length ? despesas.map(d => `<div class="line"><div><b>${d.desc}</b><br><small>${d.horario}</small></div><strong style="color:#b12f29">- ${br(d.valor)}</strong></div>`).join("") : `<div class="empty" style="padding:15px">Nenhum gasto registrado hoje.</div>`}</div>
  <div class="section-title"><h2>Produtos Vendidos (Histórico)</h2></div>
  <div class="card">${listaItens.length ? listaItens.map(([nome,info]) => `<div class="line"><div><b>${info.qtd}x ${nome}</b></div><strong>${br(info.qtd*info.preco)}</strong></div>`).join("") : `<div class="empty" style="padding:15px">Nenhuma venda finalizada ainda.</div>`}</div>`;
}

function renderizar(){
 const navM = document.getElementById("navMesas"), navC = document.getElementById("navComandas");
 navM.classList.toggle("active", telaAtual === "mesas" || telaAtual === "atendimento");
 navC.classList.toggle("active", telaAtual === "comandas");
 
 if(usuarioLogadoEmail && usuarioLogadoEmail.toLowerCase().includes('admin')){
   const navR = document.getElementById("navRelatorios");
   if(navR) navR.classList.toggle("active", telaAtual === "relatorios");
 }

 if(telaAtual === "mesas") renderMesas();
 else if(telaAtual === "atendimento") renderAtendimento();
 else if(telaAtual === "comandas") renderComandas();
 else if(telaAtual === "relatorios") renderRelatorios();
 atualizarBar();
}
</script>
</body>
</html>
