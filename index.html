<style>
:root{--brand:#b12f29;--brand-dark:#8f241f;--ink:#14281e;--bg:#f4f7f5;--card:#ffffff;--border:#e2e8e4}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:130px}.app{max-width:760px;margin:auto;padding:16px 16px 130px}

/* Header Moderno */
.header{background:linear-gradient(135deg,#b12f29,#8f241f);color:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 10px 25px rgba(177,47,41,.18);position:relative;overflow:hidden;margin-bottom:16px}
.header:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-50px;background:rgba(255,255,255,.07)}
.header h1{font-size:24px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:12px;opacity:.9}

/* Barra de Navegação Inferior Fixa com margem segura */
.bottom{position:fixed;z-index:100;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:22px;box-shadow:0 10px 30px rgba(20,40,30,.12)}
.bottom button{border:0;background:none;color:#75857c;font-weight:800;font-size:11px;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;transition:.2s;cursor:pointer}
.bottom button.active{color:var(--brand);background:#fff1f0}.bottom .ico{font-size:18px;margin-bottom:2px}

/* Grid de Mesas Estilizadas */
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.table{min-height:120px;border-radius:18px;padding:12px 6px;border:1px solid #d1e7d4;background:#f6fbf7;color:#184a27;box-shadow:0 4px 12px rgba(40,110,60,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.table:active{transform:scale(.96)}
.table.busy{border-color:#f5c6c5;background:#fff5f4;color:#8f241f;box-shadow:0 4px 12px rgba(177,47,41,.04)}
.table .num{font-size:16px;font-weight:900}
.table .status{font-size:9px;font-weight:900;margin-top:2px;letter-spacing:.3px;opacity:.8}
.table .total{font-size:11px;font-weight:900;margin-top:4px}
.table .garcom-tag{font-size:9px;background:rgba(0,0,0,.05);padding:2px 6px;border-radius:6px;margin-top:4px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Cards Genéricos */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 6px 20px rgba(20,40,30,.03);padding:16px;margin-bottom:12px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.section-title h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.muted{color:#6c7a72;font-size:12px}

.topbar{display:flex;gap:12px;align-items:center}
.back{border:0;background:#edf2ef;border-radius:12px;width:38px;height:38px;font-weight:900;font-size:15px;display:grid;place-items:center;cursor:pointer}
.mesa-head{flex:1}.mesa-head h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.mesa-head p{margin:2px 0 0;font-size:11px;color:#6c7a72}

/* Categorias do Cardápio com Scroll Suave */
.cats{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid var(--border);background:#fff;color:#526159;border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.02);cursor:pointer}
.cat.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(177,47,41,.25)}

/* Produtos em Grid */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{overflow:hidden;border-radius:18px;background:#fff;border:1px solid var(--border);box-shadow:0 4px 14px rgba(20,30,20,.03)}
.prod-img{height:75px;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8faf9,#edf2ef)}
.prod-body{padding:10px}
.prod-name{font-size:13px;font-weight:900;line-height:1.2;min-height:32px}
.prod-desc{font-size:10px;color:#6c7a72;margin-top:2px;font-weight:600}
.price{font-size:12px;font-weight:900;color:var(--brand);margin:4px 0 8px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qty button{width:32px;height:32px;border:0;border-radius:10px;background:#edf2ef;font-weight:900;font-size:16px;cursor:pointer}
.qty button.plus{background:var(--brand);color:#fff}
.qty span{font-weight:900;min-width:20px;text-align:center;font-size:14px}
.selected{outline:2px solid #52b761;outline-offset:-2px}

/* Barra Flutuante de Carrinho */
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:76px;width:min(700px,calc(100% - 24px));background:#14281e;color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 25px rgba(20,40,30,.25)}
.cartbar button{border:0;background:#fff;color:#14281e;border-radius:12px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:13px}

.modal{position:fixed;inset:0;background:rgba(10,20,15,.5);backdrop-filter:blur(4px);z-index:200;display:none;align-items:end}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:26px 26px 0 0;padding:18px;max-height:86vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}
.close{border:0;background:#edf2ef;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0f4f1;font-size:13px}
.line small{color:#6c7a72}
.totalrow{display:flex;justify-content:space-between;font-size:17px;font-weight:900;padding:14px 0;border-top:2px dashed #edf2ef;margin-top:4px}
.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:14px;box-shadow:0 4px 14px rgba(177,47,41,.2);cursor:pointer}
.secondary{width:100%;border:0;background:#edf2ef;color:#183625;border-radius:14px;padding:12px;font-weight:900;margin-top:6px;cursor:pointer;font-size:13px}
.empty{padding:30px 15px;text-align:center;color:#75857c;font-weight:700;font-size:13px}
.command{padding:16px;margin-bottom:10px}
.command .row{display:flex;justify-content:space-between;gap:10px}
.command h3{margin:0;font-size:16px;font-weight:900;color:var(--ink)}
.tag{font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px;background:#fff1f0;color:var(--brand)}
</style>
</head>

  <div style="background:#fff;border-radius:22px;padding:26px;width:100%;max-width:360px;box-shadow:0 20px 40px rgba(0,0,0,.4)">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:32px;margin-bottom:6px">🔥</div>

      <p style="font-size:11px;color:#6c7a72;margin:4px 0 0">Faça login para acessar o sistema</p>
    </div>
    <form onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:#6c7a72;display:block;margin-bottom:4px">E-mail</label>
        <input type="email" id="login-email" required style="width:100%;padding:11px;border:1px solid #d4ddd8;border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="ex: garcom@bbchurrasco.com">
      </div>
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:#6c7a72;display:block;margin-bottom:4px">Senha</label>
        <input type="password" id="login-password" required style="width:100%;padding:11px;border:1px solid #d4ddd8;border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="••••••••">
      </div>
      <div id="login-error" style="color:#b12f29;font-size:11px;font-weight:800;text-align:center;display:none">E-mail ou senha incorretos.</div>
      <button type="submit" style="background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:13px;cursor:pointer;margin-top:4px">Entrar no Sistema</button>
    </form>
  </div>
</div>

<div class="app">
<header class="header">
  <h1>B.B CHURRASCO</h1>
  <p id="user-role-label">B.B GARÇOM — Atendimento por Cliente</p>
</header>
<div id="conteudo"></div>
</div>

<div id="cartBar" class="cartbar" style="display:none">
  <div><strong id="cartCount" style="font-size:13px">0 itens</strong><br><span id="cartTotal" style="font-size:12px;opacity:.9">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navComandas" onclick="mudarTela('comandas')"><span class="ico">📋</span>Comandas</button>
 <button id="navRelatorios" onclick="mudarTela('relatorios')"><span class="ico">📊</span>Relatórios</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>

const db = firebase.firestore();
db.enablePersistence().catch(() => {});

const iconeGenerico = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="12" y1="7" x2="12.01" y2="7"/></svg>`;
const iconeCarne = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b12f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5.5a3 3 0 1 0 4 4L12 17l-5.5-5.5a3 3 0 1 0 4-4L12 8l3.5-2.5z"/></svg>`;

const cardapio={
"CHURRASCOS":[

"GUARNIÇÕES":[

["Baião caseiro pequeno", 4, iconeGenerico],

["Baião cremoso pequeno", 5, iconeGenerico],

};

let comandas = {};
let historicoVendas = [];
let despesas = [];
let cancelamentos = [];
let telaAtual = "mesas", mesaSelecionada = null, pedidoTemp = {}, clienteAtual = "Cliente 1", garcomTemp = "Hebster", categoriaAtual = "CHURRASCOS";
let usuarioLogadoEmail = "";

const br = v => (v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");

function iniciarOuvintesFirebase() {
  db.collection("comandas").onSnapshot(snapshot => {
    comandas = {};
    snapshot.forEach(doc => { 
      let id = doc.id;
      let num = parseInt(id);
      if(isNaN(num) || num < 1 || num > 30 || String(num) !== String(id).trim()){
        db.collection("comandas").doc(id).delete().catch(()=>{});
        return;
      }
      comandas[id] = doc.data(); 
    });
    if(telaAtual === "mesas" || telaAtual === "comandas") renderizar();
  }, err => console.error(err));

  db.collection("historico").onSnapshot(snapshot => {
    historicoVendas = [];
    snapshot.forEach(doc => { historicoVendas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));

  db.collection("despesas").onSnapshot(snapshot => {
    despesas = [];
    snapshot.forEach(doc => { despesas.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));

  db.collection("cancelamentos").onSnapshot(snapshot => {
    cancelamentos = [];
    snapshot.forEach(doc => { cancelamentos.push(doc.data()); });
    if(telaAtual === "relatorios") renderizar();
  }, err => console.error(err));
}

function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then((userCredential)=>{
      usuarioLogadoEmail = userCredential.user.email;
      concluirLogin(usuarioLogadoEmail);
    })
    .catch(()=>{
      document.getElementById('login-error').style.display = 'block';
    });
}

function concluirLogin(email){
  document.getElementById('login-screen').style.display = 'none';
  const isAdmin = email.toLowerCase().includes('admin');
  
  if(!isAdmin){
    document.getElementById('navRelatorios').style.display = 'none';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(2,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B GARÇOM — Atendimento por Cliente';
    if(telaAtual === 'relatorios') telaAtual = 'mesas';
  } else {
    document.getElementById('navRelatorios').style.display = 'flex';
    document.querySelector('.bottom').style.gridTemplateColumns = 'repeat(3,1fr)';
    document.getElementById('user-role-label').textContent = 'B.B ADMIN — Gestão Completa';
  }
  iniciarOuvintesFirebase();
  renderizar();
}

function mudarTela(t, num=null){
  if(t === 'relatorios' && usuarioLogadoEmail && !usuarioLogadoEmail.toLowerCase().includes('admin')) return;
  telaAtual = t; if(num !== null) mesaSelecionada = Number(num); renderizar(); scrollTo(0,0);
}

function abrirMesa(num){
  mesaSelecionada = Number(num); pedidoTemp = {}; clienteAtual = "Cliente 1"; garcomTemp = "Hebster";
  if(comandas[num]){
    garcomTemp = comandas[num].garcom || "Hebster";
    if(comandas[num].itens){
      comandas[num].itens.forEach(it => {
        let cli = it.cliente || "Cliente 1";
        if(!pedidoTemp[cli]) pedidoTemp[cli] = {};
        pedidoTemp[cli][it.nome] = (pedidoTemp[cli][it.nome] || 0) + it.qtd;
      });
    }
  }
  mudarTela("atendimento", num);
}

function atualizarGarcom(v){ 
  garcomTemp = v.trim() || "Hebster"; 
  salvarRascunhoAutomatico();
}

function mudarClienteAtual(novoCli){
  clienteAtual = novoCli.trim() || "Cliente 1";
  renderAtendimento();
}

function renomearClienteAtual(){
  let novoNome = prompt(`Renomear "${clienteAtual}" para:`, clienteAtual);
  if(!novoNome || !novoNome.trim()) return;
  novoNome = novoNome.trim();
  if(novoNome === clienteAtual) return;
  
  if(pedidoTemp[novoNome]){
    alert("Já existe uma pessoa com esse nome.");
    return;
  }
  
  pedidoTemp[novoNome] = pedidoTemp[clienteAtual] || {};
  delete pedidoTemp[clienteAtual];
  clienteAtual = novoNome;
  renderAtendimento();
  salvarRascunhoAutomatico();
}

function salvarRascunhoAutomatico(){
  if(telaAtual !== "atendimento" || !mesaSelecionada) return;
  const itens = itensTempComClientes();
  const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
  if(!itens.length && !comandas[mesaSelecionada]) return;

  const dadosMesa = { 
    garcom: garcomTemp, 
    itens: itens.length ? itens : (comandas[mesaSelecionada]?.itens || []), 
    total: itens.length ? total : (comandas[mesaSelecionada]?.total || 0), 
    atualizadoEm: Date.now() 
  };

  db.collection("comandas").doc(String(mesaSelecionada)).set(dadosMesa, { merge: true }).catch(()=>{});
}

function alterarQtd(nome, delta){ 
  if(!pedidoTemp[clienteAtual]) pedidoTemp[clienteAtual] = {};
  pedidoTemp[clienteAtual][nome] = (pedidoTemp[clienteAtual][nome] || 0) + delta; 
  if(pedidoTemp[clienteAtual][nome] < 0) pedidoTemp[clienteAtual][nome] = 0; 
  renderProdutos(); 
  atualizarBar(); 
  salvarRascunhoAutomatico(); 
}

function produtosFlat(){ let a = []; for(const cat in cardapio) cardapio[cat].forEach(p => a.push({nome:p[0], preco:p[1], svg:p[2], desc:p[3], cat})); return a; }

function itensTempComClientes(){
  let arr = [];
  for(const cli in pedidoTemp){
    for(const prod in pedidoTemp[cli]){
      let qtd = pedidoTemp[cli][prod];
      if(qtd > 0){
        let pObj = produtosFlat().find(p => p.nome === prod);
        let preco = pObj ? pObj.preco : 0;
        arr.push({ cliente: cli, nome: prod, qtd: qtd, preco: preco });
      }
    }
  }
  return arr;
}

function mudarQtdPagamento(idx, delta, maxQtd){
  let span = document.getElementById(`qtd-pagar-${idx}`);
  if(!span) return;
  let atual = parseInt(span.textContent) || 0;
  let novo = atual + delta;
  if(novo < 0) novo = 0;
  if(novo > maxQtd) novo = maxQtd;
  span.textContent = novo;
  calcularValorSelecionadoComControle();
}

function calcularValorSelecionadoComControle(){
  let totalSel = 0;
  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtd = parseInt(span.textContent) || 0;
    let preco = parseFloat(span.dataset.preco) || 0;
    totalSel += qtd * preco;
  });
  document.getElementById('lblTotalSelecionado').textContent = br(totalSel);
}

function pagarItensSelecionados(num){
  const c = comandas[num]; if(!c) return;
  let valTotalSel = 0;
  let baixas = {};
  let temSelecao = false;

  document.querySelectorAll('[id^="qtd-pagar-"]').forEach(span => {
    let qtdPagar = parseInt(span.textContent) || 0;
    if(qtdPagar > 0){
      temSelecao = true;
      let nome = span.dataset.nome;
      let cli = span.dataset.cliente;
      let preco = parseFloat(span.dataset.preco);
      valTotalSel += qtdPagar * preco;
      let chave = cli + "_" + nome;
      baixas[chave] = (baixas[chave] || 0) + qtdPagar;
    }
  });

  if(!temSelecao){ alert("Selecione a quantidade de um item."); return; }

  if(confirm(`Confirmar pagamento de ${br(valTotalSel)}?`)){
    let itensPagosParaHistorico = [];
    let novosItens = [];
    let itensPagosAcumulados = c.itensPagos ? [...c.itensPagos] : [];

    c.itens.forEach(it => {
      let cli = it.cliente || "Cliente 1";
      let chave = cli + "_" + it.nome;
      let qtdBaixada = baixas[chave] || 0;
      if(qtdBaixada > 0){
        baixas[chave] -= qtdBaixada;
        itensPagosParaHistorico.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco });
        let jaExiste = itensPagosAcumulados.find(ip => ip.cliente === cli && ip.nome === it.nome);
        if(jaExiste){ jaExiste.qtd += qtdBaixada; }
        else { itensPagosAcumulados.push({ cliente: cli, nome: it.nome, qtd: qtdBaixada, preco: it.preco }); }
      }
      let qtdRestante = it.qtd - qtdBaixada;
      if(qtdRestante > 0) novosItens.push({ cliente: cli, nome: it.nome, qtd: qtdRestante, preco: it.preco });
    });

    const vendaParcial = { mesa: num, total: valTotalSel, garcom: c.garcom || "Geral", itens: itensPagosParaHistorico, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
    let novoTotal = Math.max(0, c.total - valTotalSel);

    db.collection("historico").add(vendaParcial).then(() => {
      db.collection("comandas").doc(String(num)).update({ total: novoTotal, itens: novosItens, itensPagos: itensPagosAcumulados, atualizadoEm: Date.now() }).then(() => {
        fecharModal(); 
        alert(`Baixa de ${br(valTotalSel)} realizada!`); 
        renderizar();
      });
    });
  }
}

function abaterValorEspecifico(num){
  const c = comandas[num]; if(!c) return;
  const input = document.getElementById('inputValorAbater');
  if(!input) return;
  let valorAbater = parseFloat(input.value);
  if(isNaN(valorAbater) || valorAbater <= 0){
    alert("Digite um valor válido para abater.");
    return;
  }
  if(valorAbater > c.total){
    alert("O valor a abater não pode ser maior que o total restante da comanda.");
    return;
  }

  if(confirm(`Confirmar abatimento/pagamento parcial de ${br(valorAbater)} na Mesa ${pad(num)}?`)){
    const vendaParcial = { mesa: num, total: valorAbater, garcom: c.garcom || "Geral", itens: [{ cliente: "Geral", nome: "Pagamento por Valor Específico", qtd: 1, preco: valorAbater }], horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) };
    let novoTotal = Math.max(0, c.total - valorAbater);

    db.collection("historico").add(vendaParcial).then(() => {
      db.collection("comandas").doc(String(num)).update({ total: novoTotal, atualizadoEm: Date.now() }).then(() => {
        fecharModal();
        alert(`Abatimento de ${br(valorAbater)} realizado com sucesso!`);
        renderizar();
      });
    });
  }
}

function fecharMesaDireto(num){
 const c = comandas[num]; if(!c) return;
 if(confirm(`Deseja fechar e liberar completamente a Mesa ${pad(num)} (${br(c.total)})?`)){
   let todos = [...(c.itens || [])];
   if(c.itensPagos) c.itensPagos.forEach(ip => todos.push({ cliente: ip.cliente, nome: ip.nome, qtd: ip.qtd, preco: ip.preco }));

   const pHist = c.total > 0 && todos.length ? db.collection("historico").add({ mesa: num, total: c.total, garcom: c.garcom || "Geral", itens: todos, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) }) : Promise.resolve();

   pHist.then(() => {
     db.collection("comandas").doc(String(num)).delete().then(() => {
       fecharModal();
       alert(`Mesa ${pad(num)} fechada e liberada!`);
       renderizar();
     });
   });
 }
}

  db.collection("despesas").add({ desc, valor, horario: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) }).then(() => renderRelatorios());
}

function limparRelatorios(){
  if(confirm("Deseja zerar os relatórios do dia?")){
    const batch = db.batch();
    db.collection("historico").get().then(snap => {
      snap.docs.forEach(d => batch.delete(d.ref));
      db.collection("despesas").get().then(snap2 => {
        snap2.docs.forEach(d => batch.delete(d.ref));
        db.collection("cancelamentos").get().then(snap3 => {
          snap3.docs.forEach(d => batch.delete(d.ref));
          batch.commit().then(() => renderRelatorios());
        });
      });
    });
  }
}

  <div class="section-title"><h2>Gastos</h2></div>
  <div class="card">${despesas.length ? despesas.map(d => `<div class="line"><div><b>${d.desc}</b><br><small>${d.horario}</small></div><strong style="color:#b12f29">- ${br(d.valor)}</strong></div>`).join("") : `<div class="empty" style="padding:10px">Nenhum gasto.</div>`}</div>
  <div class="section-title"><h2>Histórico de Vendas</h2></div>
  <div class="card">${historicoVendas.length ? historicoVendas.map(v => `<div class="line"><div><b>Mesa ${pad(v.mesa)}</b> (${v.garcom})<br><small>${v.horario} • ${(v.itens||[]).map(i=>`[${i.cliente}] ${i.qtd}x ${i.nome}`).join(", ")}</small></div><strong style="color:var(--brand)">${br(v.total)}</strong></div>`).join("") : `<div class="empty" style="padding:10px">Nenhuma venda.</div>`}</div>`;
}

function renderizar(){
 const navM = document.getElementById("navMesas"), navC = document.getElementById("navComandas");
 navM.classList.toggle("active", telaAtual === "mesas" || telaAtual === "atendimento");
 navC.classList.toggle("active", telaAtual === "comandas");
 if(usuarioLogadoEmail && usuarioLogadoEmail.toLowerCase().includes('admin')){
   const navR = document.getElementById("navRelatorios");
   if(navR) navR.classList.toggle("active", telaAtual === "relatorios");
 }
 if(telaAtual === "mesas") renderMesas();
 else if(telaAtual === "atendimento") renderAtendimento();
 else if(telaAtual === "comandas") renderComandas();
 else if(telaAtual === "relatorios") renderRelatorios();
 atualizarBar();
}
</script>
</body>
</html>
