<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>B.B CHURRASCO — Sistema Unificado com Upload de Fotos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root {
  --brand: #ef4444;
  --brand-hover: #dc2626;
  --ink: #f3f4f6;
  --bg: #0d0f12;
  --card: rgba(30, 32, 38, 0.75);
  --border: rgba(255, 255, 255, 0.08);
  --muted: #9ca3af;
  --input-bg: rgba(20, 22, 27, 0.8);
}
[data-theme="light"] {
  --brand: #b12f29;
  --brand-hover: #8f241f;
  --ink: #14281e;
  --bg: #f4f7f5;
  --card: rgba(255, 255, 255, 0.85);
  --border: rgba(0, 0, 0, 0.08);
  --muted: #6c7a72;
  --input-bg: rgba(248, 250, 249, 0.9);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{padding-bottom:140px}.app{max-width:760px;margin:auto;padding:16px 16px 140px}

/* Header do Sistema */
.header{background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 12px 30px rgba(239, 68, 68, 0.25);position:relative;overflow:hidden;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:11px;opacity:.9}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-btn{background:rgba(255,255,255,.2);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}

/* Toast Flutuante */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(90%, 400px);pointer-events:none}
.toast{background:rgba(31, 41, 55, 0.95);backdrop-filter:blur(8px);color:#fff;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;pointer-events:auto;animation: fadeInOut .3s ease}
@keyframes fadeInOut { from{opacity:0;transform:translateY(-15px)} to{opacity:1;transform:translateY(0)} }

/* Navegação Inferior */
.bottom{position:fixed;z-index:100;left:50%;bottom:16px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:22px;box-shadow:0 15px 35px rgba(0,0,0,.2)}
.bottom button{border:0;background:none;color:var(--muted);font-weight:800;font-size:11px;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .2s}
.bottom button.active{color:var(--brand);background:rgba(239, 68, 68, 0.15);transform:translateY(-2px)}
.bottom .ico{font-size:18px;margin-bottom:2px}

/* Grid de Mesas */
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.table{min-height:130px;border-radius:20px;padding:10px 6px;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(12px);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.table:hover{border-color:rgba(239,68,68,0.3);transform:translateY(-2px)}
.table.busy{border-color:rgba(239, 68, 68, 0.35);background:linear-gradient(135deg, rgba(239, 68, 68, 0.08), var(--card))}
.table .num{font-size:15px;font-weight:900}
.badge-status{font-size:9px;font-weight:900;margin-top:2px;padding:2px 8px;border-radius:99px}
.badge-status.livre{background:rgba(16, 185, 129, 0.15);color:#10b981;border:1px solid rgba(16, 185, 129, 0.3)}
.badge-status.ocupada{background:rgba(239, 68, 68, 0.15);color:var(--brand);border:1px solid rgba(239, 68, 68, 0.3)}
.table .total{font-size:12px;font-weight:900;margin-top:3px;color:var(--brand)}

/* Produtos */
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.05);padding:16px;margin-bottom:12px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}.section-title h2{font-size:18px;font-weight:900;color:var(--ink);margin:0}.muted{color:var(--muted);font-size:12px}
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:14px;font-size:12px;font-weight:700;outline:none}
.search-box span{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.cats{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer}
.cat.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product{overflow:hidden;border-radius:18px;background:var(--card);border:1px solid var(--border)}
.product.selected{border-color:var(--brand)}
.prod-img{height:95px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--input-bg);overflow:hidden;font-size:28px}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-body{padding:10px}
.prod-name{font-size:13px;font-weight:900;line-height:1.2;min-height:32px;color:var(--ink)}
.price{font-size:13px;font-weight:900;color:var(--brand);margin:4px 0 8px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qty button{width:32px;height:32px;border:0;border-radius:10px;background:var(--input-bg);color:var(--ink);font-weight:900;font-size:16px;cursor:pointer}
.qty button.plus{background:var(--brand);color:#fff}
.qty span{font-weight:900;min-width:20px;text-align:center;font-size:14px}

/* Carrinho Flutuante */
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%) translateY(100px);bottom:76px;width:min(700px,calc(100% - 24px));background:rgba(30, 41, 59, 0.95);backdrop-filter:blur(20px);color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 15px 35px rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .3s ease;opacity:0}
.cartbar.show-cart{transform:translateX(-50%) translateY(0);opacity:1}
.cartbar button{border:0;background:#fff;color:#14281e;border-radius:12px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:13px}

/* Modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:200;display:none;align-items:end}
.modal.show{display:flex}
.sheet{background:var(--card);backdrop-filter:blur(25px);color:var(--ink);width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow:auto;border-top:1px solid var(--border)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:18px;font-weight:900;margin:0}
.close{border:0;background:var(--input-bg);color:var(--ink);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.totalrow{display:flex;justify-content:space-between;font-size:17px;font-weight:900;padding:14px 0;border-top:2px dashed var(--border);margin-top:4px}
.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:14px;cursor:pointer}
.secondary{width:100%;border:0;background:var(--input-bg);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:12px;font-weight:900;margin-top:6px;cursor:pointer;font-size:13px}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- TELA DE LOGIN / ESCOLHA -->
<div id="login-screen" style="position:fixed;inset:0;background:radial-gradient(circle at center, #1e2028 0%, #0d0f12 100%);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--card);backdrop-filter:blur(25px);border:1px solid var(--border);border-radius:24px;padding:26px;width:100%;max-width:380px;box-shadow:0 25px 50px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:32px;margin-bottom:6px">🔥</div>
      <h2 style="font-size:20px;font-weight:900;margin:0;color:var(--ink)">B.B CHURRASCO</h2>
      <p style="font-size:11px;color:var(--muted);margin:4px 0 0">Sistema Integrado & Cardápio</p>
    </div>
    
    <div style="display:flex;background:var(--input-bg);padding:4px;border-radius:12px;margin-bottom:16px">
      <button onclick="mudarAbaLogin('equipe')" id="tabLoginEquipe" style="flex:1;border:0;background:var(--brand);color:#fff;border-radius:9px;padding:8px;font-size:11px;font-weight:900;cursor:pointer">Equipe / Garçom</button>
      <button onclick="mudarAbaLogin('cliente')" id="tabLoginCliente" style="flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px;font-size:11px;font-weight:900;cursor:pointer">Sou Cliente (Mesa)</button>
    </div>

    <form id="formEquipeLogin" onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">E-mail</label>
        <input type="email" id="login-email" required style="width:100%;padding:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="ex: garcom@bbchurrasco.com">
      </div>
      <div>
        <label style="font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">Senha</label>
        <input type="password" id="login-password" required style="width:100%;padding:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-size:13px;font-weight:700;outline:none" placeholder="••••••••">
      </div>
      <div id="login-error" style="color:#ef4444;font-size:11px;font-weight:800;text-align:center;display:none">E-mail ou senha incorretos.</div>
      <button type="submit" style="background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:13px;cursor:pointer;margin-top:4px">Entrar no Sistema</button>
    </form>

    <div id="formClienteLogin" style="display:none;flex-direction:column;gap:12px">
      <p style="font-size:12px;color:var(--muted);text-align:center;margin:0">Selecione o número da sua mesa:</p>
      <button onclick="entrarComoClienteDirect()" style="background:#10b981;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:13px;cursor:pointer">📱 Acessar Cardápio da Mesa</button>
    </div>
  </div>
</div>

<!-- MODAL DE SELEÇÃO DE MESA -->
<div id="modal-mesa" class="modal" style="align-items:center;z-index:950">
  <div class="sheet" style="border-radius:28px;max-width:380px;text-align:center">
    <h2 style="font-size:20px;margin-bottom:4px">Qual a sua mesa?</h2>
    <div id="grid-mesas-cliente" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:220px;overflow-y:auto;margin-top:12px"></div>
  </div>
</div>

<!-- MODAL EDITAR ITEM (PREÇO / FOTO DO CELULAR) -->
<div id="modal-editar-item" class="modal" onclick="if(event.target===this)fecharModalItem()">
  <div class="sheet" style="max-width:380px">
    <div class="sheet-head"><h2 id="modalItemTitle">Editar Item</h2><button class="close" onclick="fecharModalItem()">×</button></div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:10px;font-weight:900;color:var(--muted);display:block;margin-bottom:4px">Novo Preço (R$)</label>
        <input type="number" step="0.50" id="editItemPreco" style="width:100%;padding:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);border-radius:12px;font-weight:900;font-size:14px;outline:none">
      </div>
      <div>
        <label style="font-size:10px;font-weight:900;color:var(--muted);display:block;margin-bottom:4px">Foto do Item (Direto da Galeria / Câmera)</label>
        <div style="display:flex;align-items:center;gap:10px">
          <input type="file" id="editItemFile" accept="image/*" onchange="converterFotoCelular(this)" style="display:none">
          <button type="button" onclick="document.getElementById('editItemFile').click()" style="flex:1;background:var(--input-bg);border:1px solid var(--border);color:var(--ink);padding:12px;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer">📁 Escolher Foto do Celular</button>
        </div>
        <div id="previewFotoContainer" style="margin-top:8px;text-align:center;display:none">
          <img id="previewFotoImg" style="width:70px;height:70px;border-radius:12px;object-fit:cover;border:1px solid var(--border)">
          <span style="font-size:10px;color:#10b981;display:block;margin-top:2px;font-weight:800">Foto carregada com sucesso!</span>
        </div>
      </div>
      <button class="primary" onclick="salvarAlteracaoItemCardapio()" style="margin-top:6px">💾 Salvar Alterações</button>
    </div>
  </div>
</div>

<!-- CORPO PRINCIPAL -->
<div class="app">
<header class="header">
  <div>
    <h1 id="header-title">B.B CHURRASCO</h1>
    <p id="user-role-label">Sistema Integrado</p>
  </div>
  <div class="header-actions">
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
  </div>
</header>
<div id="conteudo"></div>
</div>

<div id="cartBar" class="cartbar">
  <div><strong id="cartCount" style="font-size:13px">0 itens</strong><br><span id="cartTotal" style="font-size:12px;opacity:.9">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom" id="bottomNav">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navCardapioAdmin" onclick="mudarTela('cardapio_admin')"><span class="ico">📜</span>Cardápio / Preços</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
  authDomain: "bbchurrasco-app.firebaseapp.com",
  projectId: "bbchurrasco-app",
  storageBucket: "bbchurrasco-app.firebasestorage.app",
  messagingSenderId: "470656170967",
  appId: "1:470656170967:web:f9c96614d411561ddfe992"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db = firebase.firestore();

function showToast(msg, isError = false){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #10b981';
  t.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.remove(); }, 2500);
}

function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggleBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('bb_theme', next);
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('bb_theme') || 'dark');

let cardapio = {
  "CHURRASCOS":[
    ["Frango", 8, "🍖", "", ""], ["Porco", 8, "🍖", "", ""], ["Linguiça", 8, "🍖", "", ""],
    ["Coração de frango", 8, "🍖", "", ""], ["Carne", 8, "🍖", "", ""], ["Tripa", 8, "🍖", "", ""]
  ],
  "CARANGUEJO":[
    ["Caranguejo Unidade", 8, "🦀", "", ""], ["Combo 4 Caranguejos", 28, "🦀", "", ""]
  ],
  "BEBIDAS":[
    ["Skol", 5, "🍺", "", ""], ["Heineken", 9, "🍺", "", ""], ["Coca-Cola 1L", 8, "🥤", "", ""]
  ],
  "PETISCOS":[
    ["Batata frita", 15, "🍟", "", ""], ["Calabresa acebolada", 15, "🍢", "", ""]
  ]
};

function carregarCardapioDinamico(){
  db.collection("configuracoes").doc("cardapio").get().then(doc => {
    if(doc.exists && doc.data().dados){
      cardapio = doc.data().dados;
      if(telaAtual === "atendimento" || telaAtual === "cardapio_admin") renderizar();
    }
  }).catch(()=>{});
}

function salvarCardapioNoFirebase(){
  db.collection("configuracoes").doc("cardapio").set({ dados: cardapio })
    .then(() => { showToast("Cardápio atualizado na nuvem com sucesso!"); })
    .catch(() => { showToast("Erro ao salvar cardápio.", true); });
}

let isModoCliente = false, numeroMesaCliente = null;

function mudarAbaLogin(aba){
  if(aba === 'equipe'){
    document.getElementById('formEquipeLogin').style.display = 'flex';
    document.getElementById('formClienteLogin').style.display = 'none';
    document.getElementById('tabLoginEquipe').style.background = 'var(--brand)';
    document.getElementById('tabLoginEquipe').style.color = '#fff';
    document.getElementById('tabLoginCliente').style.background = 'transparent';
    document.getElementById('tabLoginCliente').style.color = 'var(--muted)';
  } else {
    document.getElementById('formEquipeLogin').style.display = 'none';
    document.getElementById('formClienteLogin').style.display = 'flex';
    document.getElementById('tabLoginCliente').style.background = '#10b981';
    document.getElementById('tabLoginCliente').style.color = '#fff';
    document.getElementById('tabLoginEquipe').style.background = 'transparent';
    document.getElementById('tabLoginEquipe').style.color = 'var(--muted)';
  }
}

function entrarComoClienteDirect(){
  let grid = "";
  for(let i=1; i<=30; i++){
    grid += `<button onclick="selecionarMesaCliente(${i})" style="background:var(--input-bg);border:1px solid var(--border);color:var(--ink);padding:12px;border-radius:12px;font-weight:900;cursor:pointer">${i}</button>`;
  }
  document.getElementById('grid-mesas-cliente').innerHTML = grid;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('modal-mesa').classList.add('show');
}

function selecionarMesaCliente(num){
  numeroMesaCliente = num;
  isModoCliente = true;
  document.getElementById('modal-mesa').classList.remove('show');
  document.getElementById('bottomNav').style.display = 'none';
  document.getElementById('user-role-label').textContent = `Mesa ${String(num).padStart(2,'0')} — Cardápio Digital`;
  carregarCardapioDinamico();
  mudarTela('atendimento', num);
}

function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then(()=>{
      document.getElementById('login-screen').style.display = 'none';
      carregarCardapioDinamico();
      iniciarOuvintesFirebase();
      mudarTela('mesas');
    })
    .catch(()=>{ document.getElementById('login-error').style.display = 'block'; });
}

let comandas = {};
let telaAtual = "mesas", mesaSelecionada = null, pedidoTemp = {}, clienteAtual = "Cliente 1", garcomTemp = "Hebster", categoriaAtual = "CHURRASCOS", termoBuscaProduto = "";
let itemEditandoCat = null, itemEditandoIdx = null, fotoTempBase64 = "";

const br = v => (v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(2,"0");

function iniciarOuvintesFirebase() {
  db.collection("comandas").onSnapshot(snapshot => {
    let novasComandas = {};
    snapshot.forEach(doc => { novasComandas[doc.id] = doc.data(); });
    comandas = novasComandas;
    if(!isModoCliente && telaAtual === "mesas") renderizar();
  });
}

function mudarTela(t, num=null){
  telaAtual = t; 
  if(num !== null) mesaSelecionada = Number(num); 
  renderizar(); 
  scrollTo(0,0);
}

function abrirMesa(num){
  if(isModoCliente) return;
  mesaSelecionada = Number(num); pedidoTemp = {}; clienteAtual = "Cliente 1";
  if(comandas[num] && comandas[num].itens){
    comandas[num].itens.forEach(it => {
      let cli = it.cliente || "Cliente 1";
      if(!pedidoTemp[cli]) pedidoTemp[cli] = {};
      pedidoTemp[cli][it.nome] = (pedidoTemp[cli][it.nome] || 0) + it.qtd;
    });
  }
  mudarTela("atendimento", num);
}

function alterarQtd(nome, delta){ 
  if(!pedidoTemp[clienteAtual]) pedidoTemp[clienteAtual] = {};
  pedidoTemp[clienteAtual][nome] = (pedidoTemp[clienteAtual][nome] || 0) + delta; 
  if(pedidoTemp[clienteAtual][nome] < 0) pedidoTemp[clienteAtual][nome] = 0; 
  renderProdutos(); 
  atualizarBar(); 
}

function produtosFlat(){ 
  let a = []; 
  for(const cat in cardapio) {
    cardapio[cat].forEach((p, idx) => a.push({nome:p[0], preco:p[1], icon:p[2], desc:p[3], foto:p[4], cat, idx})); 
  }
  return a; 
}

function itensTempComClientes(){
  let arr = [];
  for(const cli in pedidoTemp){
    for(const prod in pedidoTemp[cli]){
      let qtd = pedidoTemp[cli][prod];
      if(qtd > 0){
        let pObj = produtosFlat().find(p => p.nome === prod);
        arr.push({ cliente: cli, nome: prod, qtd: qtd, preco: pObj ? pObj.preco : 0 });
      }
    }
  }
  return arr;
}

function totalTemp(){ return itensTempComClientes().reduce((s,i) => s + i.qtd * i.preco, 0); }

function atualizarBar(){
  const itensArr = itensTempComClientes();
  const total = totalTemp();
  const totalItens = itensArr.reduce((a,b) => a+b.qtd, 0);
  const bar = document.getElementById("cartBar");
  if(totalItens){
    bar.classList.add("show-cart");
    document.getElementById("cartCount").textContent = `${totalItens} itens`;
    document.getElementById("cartTotal").textContent = br(total);
  } else {
    bar.classList.remove("show-cart");
  }
}

function setCategoria(cat){ categoriaAtual = cat; renderProdutos(); }

function renderProdutos(){
 const el = document.getElementById("produtos"); if(!el) return;
 let cliMap = pedidoTemp[clienteAtual] || {};
 let listaProd = cardapio[categoriaAtual] || [];
 if(termoBuscaProduto) listaProd = produtosFlat().filter(p => p.nome.toLowerCase().includes(termoBuscaProduto.toLowerCase()));

 el.innerHTML = listaProd.map(p => {
   const nome = p[0], preco = p[1], icon = p[2], foto = p[4];
   const q = cliMap[nome] || 0;
   let imgHtml = foto ? `<img src="${foto}" alt="${nome}">` : (icon || '📦');
   return `<div class="product ${q ? "selected" : ""}">
   <div class="prod-img">${imgHtml}</div>
   <div class="prod-body"><div class="prod-name">${nome}</div><div class="price">${br(preco)}</div>
   <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`;
 }).join("");
 atualizarBar();
}

function salvarComanda(){
 const itens = itensTempComClientes(); 
 if(!itens.length) return;
 const total = itens.reduce((s,i) => s + i.qtd * i.preco, 0);
 const mesaAlvo = isModoCliente ? numeroMesaCliente : mesaSelecionada;
 const comandaAtual = comandas[mesaAlvo] || {};
 
 let dadosMesa = {
   garcom: isModoCliente ? "Auto-Atendimento" : garcomTemp,
   itens: [...(comandaAtual.itens || []), ...itens],
   total: total + (comandaAtual.total || 0),
   criadoEm: comandaAtual.criadoEm || Date.now()
 };

 db.collection("comandas").doc(String(mesaAlvo)).set(dadosMesa, { merge: true })
   .then(() => {
     fecharModal();
     showToast("Pedido enviado com sucesso! 🚀");
     if(!isModoCliente) mudarTela("mesas");
   });
}

function abrirCarrinho(){
 const itens = itensTempComClientes();
 document.getElementById("modalTitle").textContent = `Resumo do Pedido`;
 document.getElementById("modalBody").innerHTML = `${itens.map(i => `<div class="line"><div><b>[${i.cliente}]</b> ${i.qtd}x ${i.nome}</div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}<div class="totalrow"><span>Total</span><span>${br(totalTemp())}</span></div><button class="primary" onclick="salvarComanda()">🚀 Enviar Pedido</button><button class="secondary" onclick="fecharModal()">Continuar</button>`;
 document.getElementById("modal").classList.add("show");
}

function abrirEdicaoItem(cat, idx){
  itemEditandoCat = cat;
  itemEditandoIdx = idx;
  const p = cardapio[cat][idx];
  document.getElementById("modalItemTitle").textContent = `Editar: ${p[0]}`;
  document.getElementById("editItemPreco").value = p[1];
  fotoTempBase64 = p[4] || "";
  
  if(fotoTempBase64){
    document.getElementById("previewFotoImg").src = fotoTempBase64;
    document.getElementById("previewFotoContainer").style.display = "block";
  } else {
    document.getElementById("previewFotoContainer").style.display = "none";
  }
  
  document.getElementById("modal-editar-item").classList.add("show");
}

function converterFotoCelular(input){
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      // Redimensiona levemente via Canvas para ficar leve no banco de dados do Firebase
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX_WIDTH = 300;
        const MAX_HEIGHT = 300;
        let width = img.width;
        let height = img.height;
        if(width > height){ if(width > MAX_WIDTH){ height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
        else { if(height > MAX_HEIGHT){ width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        fotoTempBase64 = canvas.toDataURL('image/jpeg', 0.7);
        
        document.getElementById("previewFotoImg").src = fotoTempBase64;
        document.getElementById("previewFotoContainer").style.display = "block";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function fecharModalItem(){
  document.getElementById("modal-editar-item").classList.remove("show");
}

function salvarAlteracaoItemCardapio(){
  const novoPreco = parseFloat(document.getElementById("editItemPreco").value);
  if(isNaN(novoPreco)){ showToast("Digite um preço válido.", true); return; }
  
  cardapio[itemEditandoCat][itemEditandoIdx][1] = novoPreco;
  cardapio[itemEditandoCat][itemEditandoIdx][4] = fotoTempBase64;
  
  salvarCardapioNoFirebase();
  fecharModalItem();
  renderizar();
}

function fecharModal(){ document.getElementById("modal").classList.remove("show"); }

function renderCardapioAdmin(){
  let html = `<div class="section-title"><h2>Gerenciar Cardápio (Preços e Fotos)</h2><span class="muted">Toque em qualquer item para editar</span></div>`;
  for(const cat in cardapio){
    html += `<h3 style="font-size:14px;font-weight:900;color:var(--brand);margin:16px 0 8px">${cat}</h3><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">`;
    cardapio[cat].forEach((p, idx) => {
      let foto = p[4] ? `<img src="${p[4]}" style="width:36px;height:36px;border-radius:8px;object-fit:cover">` : `<span style="font-size:20px">${p[2]}</span>`;
      html += `<div onclick="abrirEdicaoItem('${cat}', ${idx})" class="card" style="padding:10px;margin:0;cursor:pointer;display:flex;align-items:center;gap:10px">
        ${foto}
        <div style="flex:1;overflow:hidden"><div style="font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p[0]}</div><div style="font-size:12px;color:var(--brand);font-weight:900">${br(p[1])}</div></div>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById("conteudo").innerHTML = html;
}

function renderAtendimento(){
 const mesaAlvo = isModoCliente ? numeroMesaCliente : mesaSelecionada;
 document.getElementById("conteudo").innerHTML = `
 <div class="section-title"><h2>Mesa ${pad(mesaAlvo)}</h2><span class="muted">Cardápio</span></div>
 <div class="card" style="padding:12px">
   <label style="font-size:10px;font-weight:900;color:var(--muted);display:block;margin-bottom:4px">Seu Nome / Apelido:</label>
   <input type="text" id="inputNome" value="${clienteAtual}" oninput="clienteAtual=this.value" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--ink);font-weight:900;font-size:12px;outline:none">
 </div>
 <div class="search-box"><span>🔍</span><input type="text" placeholder="Pesquisar..." oninput="termoBuscaProduto=this.value;renderProdutos()"></div>
 <div class="cats">${Object.keys(cardapio).map(c => `<button class="cat ${c === categoriaAtual ? "active" : ""}" onclick="setCategoria('${c}')">${c}</button>`).join("")}</div>
 <div id="produtos" class="products"></div>`;
 renderProdutos();
}

function renderMesas(){
 let totalAbertas = 0, html = "";
 for(let i=1; i<=30; i++){
   let c = comandas[i], busy = c && (c.itens?.length || c.total > 0);
   if(busy) totalAbertas++;
   html += `<div class="table ${busy ? "busy" : ""}" onclick="abrirMesa(${i})">
     <div class="num">Mesa ${pad(i)}</div>
     <div class="badge-status ${busy ? 'ocupada' : 'livre'}">${busy ? "OCUPADA" : "LIVRE"}</div>
     ${busy ? `<div class="total">${br(c.total)}</div>` : ""}
   </div>`;
 }
 document.getElementById("conteudo").innerHTML = `<div class="section-title"><h2>Mesas</h2><span class="muted">${totalAbertas} abertas</span></div><div class="tables">${html}</div>`;
}

function renderizar(){
 if(isModoCliente){ renderAtendimento(); return; }
 if(telaAtual === "mesas") renderMesas();
 else if(telaAtual === "cardapio_admin") renderCardapioAdmin();
 else if(telaAtual === "atendimento") renderAtendimento();
}

if(isModoCliente){
  carregarCardapioDinamico();
  mudarTela('atendimento');
} else {
  renderizar();
}
</script>
</body>
