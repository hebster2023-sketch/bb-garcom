<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.B GARÇOM – B.B CHURRASCO</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --primary: #b12f27; }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 20px; }
  .primary { background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" style="display:flex; position:fixed; inset:0; background:var(--bg); z-index:999; align-items:center; justify-content:center; padding:20px;">
  <div class="card" style="width:100%; max-width:400px; text-align:center;">
    <div style="font-size:40px; margin-bottom:10px;">🔥</div>
    <h2 style="font-size:22px; font-weight:900; margin-bottom:6px;">B.B CHURRASCO</h2>
    <p style="margin:4px 0 24px 0; color:#64748b;">Faça login para acessar o sistema</p>
    
    <form onsubmit="fazerLogin(event)">
      <div style="margin-bottom:12px;">
        <input type="email" id="loginEmail" placeholder="E-mail" required style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
      </div>
      <div style="margin-bottom:16px;">
        <input type="password" id="loginSenha" placeholder="Sua senha" required style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
      </div>
      <button type="submit" class="primary" style="width:100%; padding:12px;">Entrar no Sistema</button>
    </form>
    <div id="erroLogin" style="color:red; margin-top:10px; font-size:14px;"></div>
  </div>
</div>

<div id="appContéudo" style="display:none; padding:20px;">
  <h1>Painel do Garçom</h1>
  <button onclick="sairSair()" class="primary" style="padding:10px 20px;">Sair</button>
</div>

<!-- SCRIPTS DE LOGIN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdo",
    authDomain: "bbchurrasco-app.firebaseapp.com",
    projectId: "bbchurrasco-app",
    storageBucket: "bbchurrasco-app.firebasestorage.app",
    messagingSenderId: "147065610967",
    appId: "1:47065610967:web:f9c96614138138db5df63f",
    measurementId: "G-C0KJ5GJKG2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  window.fbAuth = auth;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("telaLogin").style.display = "none";
      document.getElementById("appContéudo").style.display = "block";
    } else {
      document.getElementById("telaLogin").style.display = "flex";
      document.getElementById("appContéudo").style.display = "none";
    }
  });
</script>

<script>
  async function fazerLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const senha = document.getElementById("loginSenha").value;
    const erroDiv = document.getElementById("erroLogin");
    
    erroDiv.style.color = "blue";
    erroDiv.textContent = "Entrando...";

    try {
      await window.signInWithEmailAndPassword(window.fbAuth, email, senha);
    } catch (err) {
      erroDiv.style.color = "red";
      erroDiv.textContent = "Erro: " + err.message;
    }
  }
</script>

</body>
</html>
