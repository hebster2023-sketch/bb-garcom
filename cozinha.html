<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8faf9">
<title>B.B CHURRASCO — Tela da Cozinha</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --brand: #d32f2f;
  --brand-hover: #c42222;
  --ink: #1f2937;
  --bg: #f8faf9;
  --card: #ffffff;
  --border: rgba(0, 0, 0, 0.06);
  --muted: #6b7280;
  --input-bg: #f1f5f3;
}
[data-theme="dark"] {
  --brand: #ef4444;
  --brand-hover: #dc2626;
  --ink: #f3f4f6;
  --bg: #121212;
  --card: rgba(30, 32, 38, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --muted: #9ca3af;
  --input-bg: rgba(20, 22, 27, 0.8);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{padding-bottom:40px}.app{max-width:1200px;margin:auto;padding:16px}

/* Header */
.header{background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 10px 25px rgba(211, 47, 47, 0.2);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:22px;font-weight:900;margin:0}.header p{margin:4px 0 0;font-size:11px;opacity:.9}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-btn, .sound-btn{background:rgba(255,255,255,0.2);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;display:grid;place-items:center}
.sound-btn.active{background:rgba(16, 185, 129, 0.5);border:1px solid #10b981}

/* Toast Flutuante */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(90%, 400px);pointer-events:none}
.toast{background:rgba(31, 41, 55, 0.95);backdrop-filter:blur(8px);color:#fff;padding:12px 16px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;pointer-events:auto;animation: fadeInOut .3s ease}
@keyframes fadeInOut { from{opacity:0;transform:translateY(-15px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }

/* Grid de Pedidos da Cozinha */
.kitchen-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:16px}
.kitchen-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,0.03);display:flex;flex-direction:column;position:relative}

.card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px}
.card-header h3{margin:0;font-size:16px;font-weight:900;color:var(--brand)}
.garcom-badge{font-size:10px;background:var(--input-bg);padding:2px 8px;border-radius:8px;font-weight:800;border:1px solid var(--border)}

.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.item-row:last-child{border-bottom:0}
.item-name{font-weight:800;color:var(--ink)}
.item-qty{font-size:14px;font-weight:900;background:rgba(211, 47, 47, 0.1);color:var(--brand);padding:2px 8px;border-radius:8px}

.timer-box{font-size:10px;font-weight:800;margin-top:10px;padding:6px;border-radius:8px;text-align:center;margin-bottom:12px}
.timer-verde{background:rgba(16, 185, 129, 0.1);color:#10b981}
.timer-amarelo{background:rgba(245, 158, 11, 0.1);color:#f59e0b}
.timer-vermelho{background:rgba(211, 47, 47, 0.1);color:#d32f2f}

.actions-box{display:flex;gap:8px;margin-top:auto}
.btn-preparar{flex:1;background:#f59e0b;color:#fff;border:0;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer}
.btn-preparar:hover{background:#d97706}
.btn-pronto{flex:1;background:#10b981;color:#fff;border:0;border-radius:10px;padding:10px;font-size:12px;font-weight:800;cursor:pointer}
.btn-pronto:hover{background:#059669}

.empty-kitchen{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-weight:700;font-size:14px}
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="app">
  <header class="header">
    <div>
      <h1>🍳 B.B COZINHA</h1>
      <p>Apenas: Caranguejos, Petiscos, Guarnições e Sucos</p>
    </div>
    <div class="header-actions">
      <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="Ativar/Desativar Alerta Sonoro">🔔</button>
      <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar Tema">☀️</button>
    </div>
  </header>

  <div id="kitchen-container" class="kitchen-grid">
    <div class="empty-kitchen">Aguardando novos pedidos da cozinha...</div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
  authDomain: "bbchurrasco-app.firebaseapp.com",
  projectId: "bbchurrasco-app",
  storageBucket: "bbchurrasco-app.firebasestorage.app",
  messagingSenderId: "470656170967",
  appId: "1:470656170967:web:f9c96614d411561ddfe992",
  measurementId: "G-C0KJ5GJKG2"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db = firebase.firestore();

let somAtivo = false;
let comandasCozinha = {};
// Categorias estritas permitidas na Cozinha
const CATEGORIAS_COZINHA = ["GUARNIÇÕES", "GUARNICOS", "CARANGUEJO", "PETISCOS", "PETISCO", "SUCOS", "SUCO", "PORÇÕES", "PORCAO"];
let cardapioCategoriasMap = {};

function pad(n){ return String(n).padStart(2,"0"); }

function toggleSound(){
  somAtivo = !somAtivo;
  const btn = document.getElementById('soundToggleBtn');
  if(somAtivo){
    btn.classList.add('active');
    btn.textContent = '🔊';
    showToast("Alerta sonoro ativado!");
    falarTexto("Alerta da cozinha ativado.");
  } else {
    btn.classList.remove('active');
    btn.textContent = '🔔';
    showToast("Alerta sonoro desativado.");
  }
}

function falarTexto(texto){
  if(!somAtivo || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'pt-BR';
  window.speechSynthesis.speak(utterance);
}

function showToast(msg, isError = false){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeft = isError ? '4px solid #d32f2f' : '4px solid #10b981';
  t.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
  container.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggleBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('bb_kitchen_theme', next);
}
const savedTheme = localStorage.getItem('bb_kitchen_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);

window.addEventListener('DOMContentLoaded', () => {
  iniciarOuvinteCozinha();
});

function iniciarOuvinteCozinha(){
  // 1. Mapeia o cardápio rigorosamente pelas categorias do Firebase
  db.collection("configuracoes").doc("cardapio").get().then(doc => {
    if(doc.exists && doc.data().dados){
      const cardapioData = doc.data().dados;
      for(let cat in cardapioData){
        let catUpper = cat.toUpperCase().trim();
        cardapioData[cat].forEach(item => {
          let nomeItem = (Array.isArray(item) ? item[0] : item.nome || "").trim().toLowerCase();
          cardapioCategoriasMap[nomeItem] = catUpper;
        });
      }
    }
  }).catch(()=>{});

  // 2. Ouve comandas em tempo real
  db.collection("comandas").onSnapshot(snapshot => {
    let novasComandas = {};
    let temPedidoNovo = false;

    snapshot.forEach(doc => {
      let mesaId = doc.id;
      let dados = doc.data();
      
      // Filtra estritamente apenas itens que pertencem às categorias da cozinha
      let itensCozinha = (dados.itens || []).filter(i => {
        let nomeItemLower = (i.nome || "").trim().toLowerCase();
        let catItem = cardapioCategoriasMap[nomeItemLower] || "";
        return CATEGORIAS_COZINHA.includes(catItem);
      });

      if(itensCozinha.length > 0){
        novasComandas[mesaId] = {
          id: mesaId,
          garcom: dados.garcom || "Garçom",
          criadoEm: dados.criadoEm || dados.atualizadoEm || Date.now(),
          atualizadoEm: dados.atualizadoEm || dados.criadoEm || Date.now(),
          itens: itensCozinha
        };
        temPedidoNovo = true;
      }
    });

    comandasCozinha = novasComandas;
    if(temPedidoNovo && somAtivo){
      falarTexto("Novo pedido na cozinha!");
    }
    renderizarCozinha();
  });
}

// Função para atualizar o status do pedido na cozinha e avisar o garçom
function atualizarStatusPedido(mesaId, novoStatus){
  const comandaRef = db.collection("comandas").doc(String(mesaId));
  
  comandaRef.get().then(doc => {
    if(!doc.exists) return;
    let dados = doc.data();
    let itens = dados.itens || [];

    // Atualiza o status apenas dos itens que pertencem à cozinha
    itens = itens.map(i => {
      let nomeItemLower = (i.nome || "").trim().toLowerCase();
      let catItem = cardapioCategoriasMap[nomeItemLower] || "";
      if(CATEGORIAS_COZINHA.includes(catItem)){
        return { ...i, statusCozinha: novoStatus };
      }
      return i;
    });

    comandaRef.update({
      itens: itens,
      atualizadoEm: Date.now()
    }).then(() => {
      showToast(novoStatus === 'preparando' ? `Pedido da Mesa ${mesaId} em preparo!` : `Pedido da Mesa ${mesaId} marcado como PRONTO!`);
      if(novoStatus === 'pronto' && somAtivo){
        falarTexto(`Pedido da mesa ${mesaId} pronto para entrega!`);
      }
    });
  }).catch(err => {
    showToast("Erro ao atualizar status", true);
  });
}

function renderizarCozinha(){
  const container = document.getElementById("kitchen-container");
  let comandasArray = Object.values(comandasCozinha);

  if(comandasArray.length === 0){
    container.innerHTML = `<div class="empty-kitchen">Nenhum pedido pendente nas guarnições, caranguejos, petiscos ou sucos.</div>`;
    return;
  }

  // ORDENAÇÃO POR ORDEM DE CHEGADA (Do mais antigo para o mais recente)
  comandasArray.sort((a, b) => a.criadoEm - b.criadoEm);

  const agora = Date.now();

  container.innerHTML = comandasArray.map(comanda => {
    const tempoDecorridoMin = Math.floor((agora - comanda.criadoEm) / 60000);
    
    let timerClass = "timer-verde";
    if(tempoDecorridoMin >= 10 && tempoDecorridoMin < 20) timerClass = "timer-amarelo";
    else if(tempoDecorridoMin >= 20) timerClass = "timer-vermelho";

    // Verifica o status geral atual dos itens da cozinha
    let statusAtual = comanda.itens[0]?.statusCozinha || 'pendente';
    let statusBadgeText = '🔴 Pendente';
    if(statusAtual === 'preparando') statusBadgeText = '🟡 Preparando...';
    if(statusAtual === 'pronto') statusBadgeText = '🟢 Pronto!';

    return `
      <div class="kitchen-card">
        <div class="card-header">
          <h3>Mesa ${pad(comanda.id)}</h3>
          <span class="garcom-badge">👤 ${comanda.garcom}</span>
        </div>
        
        <div class="timer-box ${timerClass}">
          ⏱️ Chegou há ${tempoDecorridoMin} min (Ordem de Chegada) | ${statusBadgeText}
        </div>

        <div style="flex:1; margin-bottom: 12px;">
          ${comanda.itens.map(i => {
            let nomeCliente = i.cliente ? i.cliente : 'Cliente 1';
            return `
              <div class="item-row">
                <span class="item-name"><b>[${nomeCliente}]</b>${i.nome}</span>
                <span class="item-qty">${i.qtd}x</span>
              </div>
            `;
          }).join('')}
        </div>

        <div class="actions-box">
          <button class="btn-preparar" onclick="atualizarStatusPedido('${comanda.id}', 'preparando')">👨‍🍳 Preparar</button>
          <button class="btn-pronto" onclick="atualizarStatusPedido('${comanda.id}', 'pronto')">✅ Pronto</button>
        </div>
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
